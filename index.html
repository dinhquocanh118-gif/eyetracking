   elements (CamAccessid, errid, loadid, etc.) that reference these classes. */

.buttonCal,
.buttonRecalibrate {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  display: block;
  margin: 4px auto;
}

.buttonCal:disabled {
  opacity: 0.4;
  background-color: #888;
  cursor: not-allowed;
}

.loader {
  border: 6px solid #fff3f3 !important;
  border-radius: 50% !important;
  border-top: 6px solid #3498db !important;
  border-bottom: 6px solid #3498db !important;
  width: 80px !important;
  height: 80px !important;
  -webkit-animation: spin 1s linear infinite !important;
  animation: spin 1s linear infinite !important;
  display: block !important;
  margin: 40% auto 30% !important;
  z-index: 99000 !important;
  opacity: 0.5;
}

@-webkit-keyframes spin {
  0%   { -webkit-transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

    function GetPix() {
        const __canvas = document.createElement('canvas');
        var __canvasContext = __canvas.getContext('2d');
        __canvas.width = video.videoWidth;
        __canvas.height = video.videoHeight;
        __canvasContext.drawImage(video, 0, 0, __canvas.width, __canvas.height);
        var imgPixels = __canvasContext.getImageData(0, 0, __canvas.width, __canvas.height);
        return imgPixels;
    }
    //------------------------------
    function PixDif(p1, p2) {
        var dif = 0;
        for (var y = 0; y < p1.height; y += 2) {
            for (var x = 0; x < p1.width; x += 2) {
                var i = (y * 4) * p1.width + x * 4;
                var d = Math.abs(p1.data[i] - p2.data[i]);
                dif += d;
                if (d > 0) {
                    return true;
                }
            }
        }
        return false;
    }
    //------------------------------
    var pix = null;
    var pixPrev = null;

    function IsNewFrame() {
        if (video.videoWidth == 0 || video.videoHeight == 0) return false;
        if (pixPrev == null) {
            pix = GetPix();
            pixPrev = GetPix();
            return true;
        } else {
            pixPrev = pix;
            pix = GetPix();
            return PixDif(pix, pixPrev);
        }
    }

    function dataURItoBlob(dataURI) {
        // convert base64/URLEncoded data component to raw binary data held in a string
        var byteString;
        if (dataURI.split(',')[0].indexOf('base64') >= 0) byteString = atob(dataURI.split(',')[1]);
        else byteString = unescape(dataURI.split(',')[1]);
        // separate out the mime component
        var mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
        // write the bytes of the string to a typed array
        var ia = new Uint8Array(byteString.length);
        for (var i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        return ia;
        return new Blob([ia], {
            type: mimeString
        });
    }

    // Older browsers might not implement mediaDevices at all, so we set an empty object first
    if (navigator.mediaDevices === undefined) {
        navigator.mediaDevices = {};
    }

    function CheckgetUserMedia() {
        if (navigator.mediaDevices.getUserMedia === undefined) {
            navigator.mediaDevices.getUserMedia = function(constraints) {
                // First get ahold of the legacy getUserMedia, if present
                var getUserMedia = navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
                // Some browsers just don't implement it - return a rejected promise with an error
                // to keep a consistent interface
                if (!getUserMedia) {
                    ///
                    if (Logg) Logg("getUserMedia is not implemented in this browser! ", -2);
                    alert("Camera access is not supported by this browser! Try: Chrome 53+ | Edge 12+ | Firefox 42+ | Opera 40+ | Safari 11+  ");
                    //  if( GazeCloudAPI.OnCamDenied != null)
                    //      GazeCloudAPI.OnCamDenied();
                    return Promise.reject(new Error('getUserMedia is not implemented in this browser'));
                }
                // Otherwise, wrap the call to the old navigator.getUserMedia with a Promise
                return new Promise(function(resolve, reject) {
                    getUserMedia.call(navigator, constraints, resolve, reject);
                });
            }
        }
    }

    function GetGazeEvent(time) {
        var BestIx = 0;
        var BestDif = 99999999999999;
        var fLen = GazeResultEvents.length;
        if (fLen == 0) return null;
        if (LastGetGazeEvent == null) LastGetGazeEvent = GazeResultEvents[0];
        for (i = 0; i < fLen; i++) {
            var dif = Math.abs(GazeResultEvents[i].time - time);
            if (dif < BestDif) {
                BestDif = dif;
                BestIx = i;
            } else break;
        }
        if (BestDif > 200) return null;
        var out = GazeResultEvents[BestIx];
        LastGetGazeEvent = out;
        return out;
    }

    function PlotGazeData(GazeData) {
        var delay = Date.now() - GazeData.time;
        var FrameCountDelay = CurFrameNr - CurFrameReciveNr;
        if (delay > maxDelay) maxDelay = delay;
        avrDelay = .99 * avrDelay + .01 * delay;
        //var x = GazeData.GazeX -window.screenX;
        //var y = GazeData.GazeY -window.screenY-   ( window.outerHeight-window.innerHeight);
        var x = GazeData.GazeX - window.screenX;
        var y = GazeData.GazeY - window.screenY - (window.outerHeight - window.innerHeight * window.devicePixelRatio / CalDeviceRation);
        x /= window.devicePixelRatio / CalDeviceRation;
        y /= window.devicePixelRatio / CalDeviceRation;
        //if(false)
        if (true) //boundary lim
        {
            var _m = 50;
            if (_m < window.innerWidth / 12.0) _m = window.innerWidth / 12.0;
            if (_m < window.innerHeight / 12.0) _m = window.innerHeight / 12.0
            var _h_ = (window.outerHeight - window.innerHeight);;
            if (x < 0 && x > -_m) x = .2 * x //;x = 0;
            if (y < 0 && y > -_m) y = .2 * y; //y = 0;
            var _w = window.innerWidth;
            var _h = window.innerHeight;;
            if (x > _w && x - _w < _m) x = .2 * x + .8 * _w; //  x = _w;
            if (y > _h && y - _h < _m)
                //y = _h;
                y = .2 * y + .8 * _h; //  x = _w;
        }
        if (true) {
            var scrollY = Math.max(document.body.scrollTop, window.scrollY)
            var scrollX = Math.max(document.body.scrollLeft, window.scrollX)
            x += scrollX; //document.body.scrollTop;
            y += scrollY; //document.body.scrollTop;
        }
        if (true) {
            GazeData.Xview = x / window.innerWidth;
            GazeData.Yview = y / window.innerHeight
            GazeData.docX = x;
            GazeData.docY = y;

            var outGazeData = GazeData;
            outGazeData.docX = x;
            outGazeData.docY = y;
            GazeCloudAPI.OnResult(outGazeData);

        var Gazeevent = new GazeEvent();
        Gazeevent.docX = Math.round(x);
        Gazeevent.docY = Math.round(y);

    function get_browser_info() {
        var ua = navigator.userAgent,
            tem, M = ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
        if (/trident/i.test(M[1])) {
            tem = /\brv[ :]+(\d+)/g.exec(ua) || [];
            return {
                name: 'IE ',
                version: (tem[1] || '')
            };
        }
        if (M[1] === 'Chrome') {
            tem = ua.match(/\bOPR\/(\d+)/)
            if (tem != null) {
                return {
                    name: 'Opera',
                    version: tem[1]
                };
            }
        }
        M = M[2] ? [M[1], M[2]] : [navigator.appName, navigator.appVersion, '-?'];
        if ((tem = ua.match(/version\/(\d+)/i)) != null) {
            M.splice(1, 1, tem[1]);
        }
        return {
            name: M[0],
            version: M[1]
        };
    }

    function openFullscreen(callback) {
       // return;
        try {
            var elem = document.body;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().then(callback);
            } else if (elem.mozRequestFullScreen) {
                /* Firefox */
                elem.mozRequestFullScreen().then(callback);;
            } else if (elem.webkitRequestFullscreen) {
                /* Chrome, Safari and Opera */
                elem.webkitRequestFullscreen().then(callback);;
            } else if (elem.msRequestFullscreen) {
                /* IE/Edge */
                elem.msRequestFullscreen().then(callback);;
                if (false)
                    if (callback) callback();
            }
        } catch (ee) {
            if (callback) callback();
        }
    }

input[type=file]{display:none}
.drop-zone{border:1px dashed var(--border-2);background:var(--bg-2);transition:all 0.2s}

.stim-thumb{width:80px;height:48px;background:var(--bg);border:1px solid var(--border);object-fit:cover;display:block}
.stim-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);transition:background 0.15s}

.stim-tab:hover{color:var(--text);border-color:var(--text-3)}
.stim-tab.active{background:var(--accent);color:#111;border-color:var(--accent)}

.rec-fs-controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9001;display:flex;gap:12px;align-items:center;background:rgba(0,0,0,0.7);padding:10px 16px;border:1px solid var(--border);backdrop-filter:blur(8px)}
.rec-fs-status{position:fixed;top:20px;left:20px;z-index:9001;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);background:rgba(0,0,0,0.5);padding:8px 14px;border:1px solid var(--border);display:flex;gap:10px;align-items:center}
.rec-fs-fixation{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Instrument Serif',serif;font-size:80px;color:var(--accent);z-index:9001}
.home-floating{position:fixed;left:14px;top:14px;z-index:12000;width:42px;height:42px;border-radius:999px;border:1px solid var(--border-2);background:rgba(12,12,14,0.86);color:var(--text-2);font-family:'JetBrains Mono',monospace;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,0.35);backdrop-filter:blur(10px);cursor:pointer;transition:all .15s}
.home-floating:hover{color:var(--accent);border-color:var(--accent);background:rgba(245,158,11,0.08)}
/* Hide the floating Home button while the participant is in CalibrationPhase */
body.eyelab-calibrating .home-floating{
  display:none !important;
  visibility:hidden !important;
  pointer-events:none !important;
}

<body>
<div id="root"></div>
<div class="scanline"></div>

<script type="text/babel" data-presets="env,react">
const {useState,useRef,useEffect,useCallback,useMemo} = React;

// ============================================================
// UTILITIES
// ============================================================
const nowMs=()=>performance.now();
const fmt=(n,d=2)=>(n==null||isNaN(n))?'—':Number(n).toFixed(d);
const fmtMs=(ms)=>{if(ms==null||isNaN(ms))return '—';if(ms<1000)return Math.round(ms)+'ms';return (ms/1000).toFixed(2)+'s'};
const fmtTime=(s)=>{if(s==null||isNaN(s))return '0:00';const m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+String(r).padStart(2,'0')};
const generateSessionId=()=>{const d=new Date(),pad=n=>String(n).padStart(2,'0');return `S${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`};
const median=arr=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const stddev=arr=>{if(!arr.length)return 0;const m=arr.reduce((s,v)=>s+v,0)/arr.length;return Math.sqrt(arr.reduce((s,v)=>s+(v-m)**2,0)/arr.length)};
const slug=s=>(s||'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||'stim';

const DEFAULT_IMAGE_DURATION_SEC=8;

const LEGACY_PROJECT_STORAGE_KEY='eyelab_project_gazecloud_v1';
const EYELAB_DB_NAME='eyelab_research_indexeddb_v2';
const EYELAB_DB_VERSION=3;
const EYELAB_PROJECT_STORE='projects';
const EYELAB_META_STORE='meta';
const EYELAB_TEST_STORE='testSessions';
const DEFAULT_PROJECT_NAME='Default Project';
const fileToDataURL=(file)=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
const downloadBlob=(blob,filename)=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
const sleep=(ms)=>new Promise(res=>setTimeout(res,ms));
function newProjectId(){return 'PRJ-'+Date.now()+'-'+Math.random().toString(16).slice(2,8)}
function serializeStimuliForStorage(stimuli){
  return stimuli.map(({id,type,name,industry,fileName,size,displayDurationSec,order,aois,dataUrl,url})=>({id,type,name,industry:industry||'',fileName,size,displayDurationSec,order,aois:aois||[],dataUrl:dataUrl||url}));
}
function hydrateStoredStimuli(items){
  return (items||[]).map((s,i)=>({...s,id:s.id||Date.now()+i,order:i+1,industry:s.industry||'',url:s.dataUrl,aois:s.aois||[],gazeData:[],durationMs:0}));
}
function createProjectPayload(stimuli=[],projectInfo={}){
  const id=projectInfo.id||newProjectId();
  const name=(projectInfo.name||DEFAULT_PROJECT_NAME).trim()||DEFAULT_PROJECT_NAME;
  return{version:2,engine:'GazeCloudAPI',storage:'IndexedDB',id,name,createdAt:projectInfo.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),stimuli:serializeStimuliForStorage(stimuli)};
}
function openEyeLabDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('IndexedDB is not supported in this browser.'));return}
    const req=indexedDB.open(EYELAB_DB_NAME,EYELAB_DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(EYELAB_PROJECT_STORE))db.createObjectStore(EYELAB_PROJECT_STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(EYELAB_META_STORE))db.createObjectStore(EYELAB_META_STORE,{keyPath:'key'});
      if(!db.objectStoreNames.contains(EYELAB_TEST_STORE)){
        const testStore=db.createObjectStore(EYELAB_TEST_STORE,{keyPath:'id'});
        testStore.createIndex('projectId','projectId',{unique:false});
        testStore.createIndex('participantId','participantId',{unique:false});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function idbRequest(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idbGet(storeName,key){const db=await openEyeLabDB();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly');const store=tx.objectStore(storeName);const req=store.get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
async function idbPut(storeName,value){const db=await openEyeLabDB();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(value);tx.oncomplete=()=>{db.close();resolve(value)};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function idbDelete(storeName,key){const db=await openEyeLabDB();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).delete(key);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function idbGetAll(storeName){const db=await openEyeLabDB();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly');const req=tx.objectStore(storeName).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
async function getActiveProjectId(){const row=await idbGet(EYELAB_META_STORE,'activeProjectId').catch(()=>null);return row?.value||null}
async function setActiveProjectId(id){await idbPut(EYELAB_META_STORE,{key:'activeProjectId',value:id});return id}
async function loadProjectList(){
  const rows=await idbGetAll(EYELAB_PROJECT_STORE).catch(()=>[]);
  return rows.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).map(p=>({id:p.id,name:p.name||DEFAULT_PROJECT_NAME,updatedAt:p.updatedAt,createdAt:p.createdAt,stimulusCount:(p.stimuli||[]).length,aoiCount:(p.stimuli||[]).reduce((s,x)=>s+(x.aois?.length||0),0)}));
}
async function loadStoredProject(projectId=null){
  let id=projectId||await getActiveProjectId();
  if(id){const p=await idbGet(EYELAB_PROJECT_STORE,id).catch(()=>null);if(p){await setActiveProjectId(p.id);return p}}
  const projects=await idbGetAll(EYELAB_PROJECT_STORE).catch(()=>[]);
  if(projects.length){const p=projects.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0];await setActiveProjectId(p.id);return p}
  // One-time migration from the older localStorage project, then clear it so storage truly moves to IndexedDB.
  try{
    const legacy=JSON.parse(localStorage.getItem(LEGACY_PROJECT_STORAGE_KEY)||'null');
    if(legacy?.stimuli?.length){
      const migrated=createProjectPayload(hydrateStoredStimuli(legacy.stimuli),{name:legacy.name||'Migrated Project',createdAt:legacy.updatedAt});
      await idbPut(EYELAB_PROJECT_STORE,migrated);await setActiveProjectId(migrated.id);localStorage.removeItem(LEGACY_PROJECT_STORAGE_KEY);return migrated;
    }
  }catch(e){}
  return null;
}
async function saveStoredProject(stimuli,projectInfo={}){
  const current=projectInfo.id?await idbGet(EYELAB_PROJECT_STORE,projectInfo.id).catch(()=>null):null;
  const payload=createProjectPayload(stimuli,{...current,...projectInfo});
  await idbPut(EYELAB_PROJECT_STORE,payload);await setActiveProjectId(payload.id);return payload;
}
async function createStoredProject(name='New Project'){
  const payload=createProjectPayload([],{name});
  await idbPut(EYELAB_PROJECT_STORE,payload);await setActiveProjectId(payload.id);return payload;
}
async function deleteStoredProject(projectId){
  if(!projectId)return await loadProjectList();
  // Delete the project first, then remove all saved test sessions that belong to it.
  // Each step is isolated so one missing/old IndexedDB store cannot silently block the UI refresh.
  await idbDelete(EYELAB_PROJECT_STORE,projectId);
  await deleteTestSessionsByProject(projectId).catch(err=>console.warn('Could not delete project test sessions:',err));
  const list=await loadProjectList();
  await setActiveProjectId(list[0]?.id||null).catch(err=>console.warn('Could not update active project:',err));
  return list;
}

function compactStimulusForSession(stimulus){
  return{
    id:stimulus.id,order:stimulus.order,name:stimulus.name,industry:stimulus.industry||'',
    type:stimulus.type,fileName:stimulus.fileName,displayDurationSec:stimulus.displayDurationSec,
    durationMs:stimulus.durationMs||stimulus.displayDurationSec*1000,
    aoiCount:(stimulus.aois||[]).length
  };
}
function compactStimulusResultForStorage(result){
  return{
    stimulus:compactStimulusForSession(result.stimulus),
    session:result.session,
    aois:(result.aois||[]).map(a=>({...a})),
    gazeData:(result.gazeData||[]).map(p=>({
      timestamp:p.timestamp,videoTime:p.videoTime,screenX:p.screenX,screenY:p.screenY,
      xNorm:p.xNorm,yNorm:p.yNorm,aoi:p.aoi||''
    })),
    fixations:(result.fixations||[]).map(f=>({
      id:f.id,x:f.x,y:f.y,duration:f.duration,startTime:f.startTime,endTime:f.endTime,
      videoTimeStart:f.videoTimeStart,videoTimeEnd:f.videoTimeEnd,points:f.points
    }))
  };
}
async function saveTestSessionRecord({sessionId,projectInfo,demographics,stimulusResults}){
  if(!sessionId||!stimulusResults?.length)return null;
  const activeProject=projectInfo?.id?projectInfo:(await loadStoredProject().catch(()=>null));
  const resolvedProjectId=activeProject?.id||projectInfo?.id||'no_project';
  const resolvedProjectName=activeProject?.name||projectInfo?.name||DEFAULT_PROJECT_NAME;
  const safeSessionId=sessionId+'_'+resolvedProjectId;
  const record={
    id:safeSessionId,sessionId,createdAt:new Date().toISOString(),
    projectId:resolvedProjectId,projectName:resolvedProjectName,
    participantId:demographics?.participantId||'',participantName:demographics?.name||'',
    demographics:{...demographics},
    stimulusCount:stimulusResults.length,
    totalSamples:stimulusResults.reduce((s,r)=>s+(r.session?.totalSamples||0),0),
    totalFixations:stimulusResults.reduce((s,r)=>s+(r.session?.totalFixations||0),0),
    stimulusResults:stimulusResults.map(compactStimulusResultForStorage)
  };
  await idbPut(EYELAB_TEST_STORE,record);
  return record;
}
async function loadTestSessions(projectId=null){
  const rows=await idbGetAll(EYELAB_TEST_STORE).catch(()=>[]);
  const filtered=projectId?rows.filter(r=>r.projectId===projectId):rows;
  return filtered.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
}
async function deleteTestSession(sessionId){
  await idbDelete(EYELAB_TEST_STORE,sessionId);
  return true;
}
async function deleteTestSessionsByProject(projectId){
  if(!projectId)return 0;
  const rows=await loadTestSessions(projectId).catch(()=>[]);
  for(const r of rows){await idbDelete(EYELAB_TEST_STORE,r.id).catch(()=>null)}
  return rows.length;
}
function exportSavedTestSessionsExcel(sessions,filenamePrefix='eyelab_all_saved_tests'){
  const wb=XLSX.utils.book_new();
  const overviewHeaders=['session_id','created_at','project_id','project_name','participant_id','participant_name','age','gender','education','email','stimulus_count','total_samples','total_fixations'];
  const overviewRows=sessions.map(r=>[r.sessionId,r.createdAt,r.projectId,r.projectName,r.participantId,r.participantName,r.demographics?.age||'',r.demographics?.gender||'',r.demographics?.education||'',r.demographics?.email||'',r.stimulusCount||0,r.totalSamples||0,r.totalFixations||0]);
  const wsOverview=XLSX.utils.aoa_to_sheet([overviewHeaders,...overviewRows]);
  wsOverview['!cols']=overviewHeaders.map(h=>({wch:Math.max(14,h.length+2)}));
  XLSX.utils.book_append_sheet(wb,wsOverview,'Saved Users');

  const spssRows=[];
  sessions.forEach(r=>{
    (r.stimulusResults||[]).forEach(sr=>{
      const row=buildSpssRow({sessionId:r.sessionId,demographics:r.demographics||{},stimulus:sr.stimulus,session:sr.session||{},aoiMetrics:sr.aois||[]});
      row.project_id=r.projectId;row.project_name=r.projectName;row.test_created_at=r.createdAt;
      spssRows.push(row);
    });
  });
  const spssKeys=Array.from(new Set(spssRows.flatMap(r=>Object.keys(r))));
  const wsSpss=XLSX.utils.aoa_to_sheet([spssKeys,...spssRows.map(r=>spssKeys.map(k=>r[k]??''))]);
  wsSpss['!cols']=spssKeys.map(h=>({wch:Math.max(14,h.length+2)}));
  XLSX.utils.book_append_sheet(wb,wsSpss,'All SPSS Ready');

  const rawHeaders=['session_id','project_id','project_name','participant_id','participant_name','stimulus_id','stimulus_name','stimulus_industry','stimulus_type','sample_idx','timestamp_ms','stim_time_ms','screen_x_px','screen_y_px','x_norm','y_norm','inside_stim','aoi_hit'];
  const rawRows=[];
  sessions.forEach(r=>{
    (r.stimulusResults||[]).forEach(sr=>{
      (sr.gazeData||[]).forEach((g,i)=>{
        const inside=(g.xNorm>=0&&g.xNorm<=1&&g.yNorm>=0&&g.yNorm<=1)?1:0;
        rawRows.push([r.sessionId,r.projectId,r.projectName,r.participantId,r.participantName,sr.stimulus?.order,sr.stimulus?.name,sr.stimulus?.industry||'',sr.stimulus?.type,i+1,Math.round(g.timestamp||0),Math.round(g.videoTime||0),Math.round(g.screenX||0),Math.round(g.screenY||0),fmt(g.xNorm,4),fmt(g.yNorm,4),inside,g.aoi||'']);
      });
    });
  });
  const wsRaw=XLSX.utils.aoa_to_sheet([rawHeaders,...rawRows]);
  wsRaw['!cols']=rawHeaders.map(h=>({wch:Math.max(12,h.length+2)}));
  XLSX.utils.book_append_sheet(wb,wsRaw,'All Raw Samples');

  const aoiHeaders=['session_id','project_id','participant_id','participant_name','stimulus_id','stimulus_name','stimulus_industry','aoi_id','aoi_name','hit_count','fixation_count','visit_count','revisit_count','total_dwell_ms','mean_fix_dur_ms','ttff_ms','pct_time','pct_time_active','attention_index'];
  const aoiRows=[];
  sessions.forEach(r=>{
    (r.stimulusResults||[]).forEach(sr=>{
      (sr.aois||[]).forEach(a=>aoiRows.push([r.sessionId,r.projectId,r.participantId,r.participantName,sr.stimulus?.order,sr.stimulus?.name,sr.stimulus?.industry||'',a.id,a.name,a.hitCount,a.fixationCount,a.visitCount,a.revisitCount,Math.round(a.totalDwellMs||0),fmt(a.meanFixationDurMs,1),a.timeToFirstFixationMs??'',fmt(a.pctTimeOnAoi,2),fmt(a.pctTimeOnAoiActive,2),fmt(a.attentionIndex,2)]));
    });
  });
  const wsAoi=XLSX.utils.aoa_to_sheet([aoiHeaders,...aoiRows]);
  wsAoi['!cols']=aoiHeaders.map(h=>({wch:Math.max(12,h.length+2)}));
  XLSX.utils.book_append_sheet(wb,wsAoi,'All AOI Metrics');

  XLSX.writeFile(wb,`${filenamePrefix}_${new Date().toISOString().slice(0,10)}.xlsx`);
}


function detectFixations(gazePoints,dispersionPx=50,minDurationMs=100){
  if(!gazePoints.length)return[];
  const fix=[];let win=[gazePoints[0]];
  for(let i=1;i<gazePoints.length;i++){
    const trial=[...win,gazePoints[i]];
    const xs=trial.map(q=>q.x),ys=trial.map(q=>q.y);
    const disp=(Math.max(...xs)-Math.min(...xs))+(Math.max(...ys)-Math.min(...ys));
    if(disp<=dispersionPx)win=trial;
    else{
      const dur=win[win.length-1].timestamp-win[0].timestamp;
      if(dur>=minDurationMs&&win.length>1){
        const cx=win.reduce((s,q)=>s+q.x,0)/win.length;
        const cy=win.reduce((s,q)=>s+q.y,0)/win.length;
        fix.push({id:fix.length+1,x:cx,y:cy,duration:dur,startTime:win[0].timestamp,endTime:win[win.length-1].timestamp,videoTimeStart:win[0].videoTime,videoTimeEnd:win[win.length-1].videoTime,points:win.length});
      }
      win=[gazePoints[i]];
    }
  }
  if(win.length>1){
    const dur=win[win.length-1].timestamp-win[0].timestamp;
    if(dur>=minDurationMs){
      const cx=win.reduce((s,q)=>s+q.x,0)/win.length;
      const cy=win.reduce((s,q)=>s+q.y,0)/win.length;
      fix.push({id:fix.length+1,x:cx,y:cy,duration:dur,startTime:win[0].timestamp,endTime:win[win.length-1].timestamp,videoTimeStart:win[0].videoTime,videoTimeEnd:win[win.length-1].videoTime,points:win.length});
    }
  }
  return fix;
}

// AOI hit test with optional time bounds (videoTimeSec is current time in seconds)
function whichAOI(xN,yN,aois,videoTimeSec){
  for(const a of aois){
    if(videoTimeSec!=null){
      if(videoTimeSec<a.startTime||videoTimeSec>a.endTime)continue;
    }
    if(xN>=a.x&&xN<=a.x+a.w&&yN>=a.y&&yN<=a.y+a.h)return a;
  }
  return null;
}



// Compute the actual visible media rectangle when img/video uses object-fit: contain.
// This lets us upscale low-resolution images to fill the recording viewport while keeping AOI coordinates accurate.
function getRenderedMediaRect(mediaEl, stageEl){
  if(!mediaEl)return null;
  const elRect=mediaEl.getBoundingClientRect();
  const stageRect=stageEl?stageEl.getBoundingClientRect():{left:0,top:0};
  const boxW=elRect.width, boxH=elRect.height;
  if(!boxW||!boxH)return null;
  const naturalW=mediaEl.tagName==='VIDEO'?(mediaEl.videoWidth||mediaEl.naturalWidth||boxW):(mediaEl.naturalWidth||boxW);
  const naturalH=mediaEl.tagName==='VIDEO'?(mediaEl.videoHeight||mediaEl.naturalHeight||boxH):(mediaEl.naturalHeight||boxH);
  if(!naturalW||!naturalH){
    return {left:elRect.left-stageRect.left,top:elRect.top-stageRect.top,width:boxW,height:boxH,viewportLeft:elRect.left,viewportTop:elRect.top};
  }
  const scale=Math.min(boxW/naturalW,boxH/naturalH);
  const renderW=naturalW*scale;
  const renderH=naturalH*scale;
  const padX=(boxW-renderW)/2;
  const padY=(boxH-renderH)/2;
  return {
    left:elRect.left-stageRect.left+padX,
    top:elRect.top-stageRect.top+padY,
    width:renderW,
    height:renderH,
    viewportLeft:elRect.left+padX,
    viewportTop:elRect.top+padY,
  };
}

// Comprehensive metrics for a single stimulus
function computeMetrics(gazeData,fixations,aois,videoDurationMs){
  if(!gazeData.length)return{session:{videoDurationMs,totalSamples:0,totalFixations:0,totalSaccades:0,samplingRateHz:0,meanFixationDurMs:0,medianFixationDurMs:0,stdFixationDurMs:0,fixationRatePerSec:0,meanSaccadeAmp:0,meanSaccadeVel:0,scanPathLength:0,engagementScore:0,videoFocus:0,aoiCoverage:0,timeToFirstFixationMs:null,firstGazeInVideoMs:null,lastGazeInVideoMs:null,dropOffPointMs:null,totalSessionMs:0},aois:aois.map(a=>({...a,hitCount:0,fixationCount:0,visitCount:0,revisitCount:0,totalDwellMs:0,meanFixationDurMs:0,timeToFirstFixationMs:null,timeToFirstVisitMs:null,lastFixationMs:null,pctTimeOnAoi:0,pctTimeOnAoiActive:0,meanDwellPerVisitMs:0,areaPct:a.w*a.h*100,activeDurationSec:a.endTime-a.startTime,attentionIndex:0}))};
  const totalSession=gazeData[gazeData.length-1].videoTime-gazeData[0].videoTime;
  const inVideo=gazeData.filter(p=>p.xNorm>=0&&p.xNorm<=1&&p.yNorm>=0&&p.yNorm<=1);
  const inAnyAoi=gazeData.filter(p=>p.aoi!=null);
  const saccades=[];
  for(let i=1;i<fixations.length;i++){
    const a=fixations[i-1],b=fixations[i];
    const amp=Math.hypot(b.x-a.x,b.y-a.y);
    const dur=Math.max(1,b.startTime-a.endTime);
    saccades.push({amplitude:amp,duration:dur,velocity:amp/dur});
  }
  const scanPath=saccades.reduce((s,sc)=>s+sc.amplitude,0);
  const fixDurs=fixations.map(f=>f.duration);
  const ttffOverall=fixations.length?fixations[0].videoTimeStart:null;
  const firstInVideo=inVideo.length?inVideo[0].videoTime:null;
  const lastInVideo=inVideo.length?inVideo[inVideo.length-1].videoTime:null;
  const engagementScore=gazeData.length?(inAnyAoi.length/gazeData.length)*100:0;
  const videoFocus=gazeData.length?(inVideo.length/gazeData.length)*100:0;
  const aoiVisited=new Set(gazeData.map(p=>p.aoi).filter(Boolean));
  const coverage=aois.length?(aoiVisited.size/aois.length)*100:0;
  const session={
    totalSamples:gazeData.length,totalFixations:fixations.length,totalSaccades:saccades.length,
    totalSessionMs:totalSession,videoDurationMs,
    samplingRateHz:totalSession?(gazeData.length/(totalSession/1000)):0,
    meanFixationDurMs:fixDurs.length?fixDurs.reduce((s,v)=>s+v,0)/fixDurs.length:0,
    medianFixationDurMs:median(fixDurs),stdFixationDurMs:stddev(fixDurs),
    fixationRatePerSec:totalSession?(fixations.length/(totalSession/1000)):0,
    meanSaccadeAmp:saccades.length?saccades.reduce((s,v)=>s+v.amplitude,0)/saccades.length:0,
    meanSaccadeVel:saccades.length?saccades.reduce((s,v)=>s+v.velocity,0)/saccades.length:0,
    scanPathLength:scanPath,engagementScore,videoFocus,aoiCoverage:coverage,
    timeToFirstFixationMs:ttffOverall,firstGazeInVideoMs:firstInVideo,lastGazeInVideoMs:lastInVideo,
    dropOffPointMs:lastInVideo,
  };
  const aoiMetrics=aois.map(a=>{
    const ptsIn=gazeData.filter(p=>p.aoi===a.name);
    const fxIn=fixations.filter(f=>{
      const vt=f.videoTimeStart/1000;
      if(vt<a.startTime||vt>a.endTime)return false;
      return f.x>=a.x&&f.x<=a.x+a.w&&f.y>=a.y&&f.y<=a.y+a.h;
    });
    let visits=0;let prev=false;
    for(const p of gazeData){const cur=p.aoi===a.name;if(cur&&!prev)visits++;prev=cur}
    const dwell=fxIn.reduce((s,f)=>s+f.duration,0);
    const fxDurs=fxIn.map(f=>f.duration);
    const aoiDurMs=Math.max(1,(a.endTime-a.startTime)*1000);
    return{
      ...a,hitCount:ptsIn.length,fixationCount:fxIn.length,visitCount:visits,
      revisitCount:Math.max(0,visits-1),totalDwellMs:dwell,
      meanFixationDurMs:fxDurs.length?fxDurs.reduce((s,v)=>s+v,0)/fxDurs.length:0,
      timeToFirstFixationMs:fxIn.length?fxIn[0].videoTimeStart:null,
      timeToFirstVisitMs:ptsIn.length?ptsIn[0].videoTime:null,
      lastFixationMs:fxIn.length?fxIn[fxIn.length-1].videoTimeEnd:null,
      pctTimeOnAoi:totalSession?(dwell/totalSession)*100:0,
      pctTimeOnAoiActive:(dwell/aoiDurMs)*100,
      meanDwellPerVisitMs:visits?dwell/visits:0,
      areaPct:a.w*a.h*100,activeDurationSec:a.endTime-a.startTime,
      attentionIndex:visits?(dwell/Math.max(0.01,a.w*a.h*100)):0,
    };
  });
  return{session,aois:aoiMetrics};
}

// ============================================================
// HEATMAP — STATIC, LOW-RES, BLURRED, COLORIZED, CACHED
// ============================================================
// Color ramp blue → green → yellow → red. t in [0,1].
function colorRamp(t){
  t=Math.max(0,Math.min(1,t));
  const stops=[
    {p:0.25,c:[0,0,255]},
    {p:0.55,c:[0,255,0]},
    {p:0.85,c:[255,255,0]},
    {p:1.00,c:[255,0,0]},
  ];
  if(t<=stops[0].p)return stops[0].c;
  for(let i=1;i<stops.length;i++){
    const a=stops[i-1],b=stops[i];
    if(t<=b.p){
      const k=(t-a.p)/(b.p-a.p);
      return[
        Math.round(a.c[0]+(b.c[0]-a.c[0])*k),
        Math.round(a.c[1]+(b.c[1]-a.c[1])*k),
        Math.round(a.c[2]+(b.c[2]-a.c[2])*k),
      ];
    }
  }
  return stops[stops.length-1].c;
}

// Build heatmap onto a low-res canvas, then return it.
// Caller scales it up to display size. Result is cached by gazeData reference.
function buildHeatmapLowRes(points,lowW,lowH){
  // GazeRecorder-style heatmap renderer: radius + blur + gradient colorization.
  // This follows the same principle as heatmap.js used by GazeRecorder instead of a hard density grid.
  const canvas=document.createElement('canvas');
  canvas.width=lowW;canvas.height=lowH;
  const ctx=canvas.getContext('2d');
  if(!points.length)return canvas;

  const valid=points.filter(p=>p.xNorm>=0&&p.xNorm<=1&&p.yNorm>=0&&p.yNorm<=1);
  if(!valid.length)return canvas;

  // Bin nearby samples first so high-frequency gaze streams do not over-saturate the canvas.
  const bins=new Map();
  for(const p of valid){
    const px=Math.min(lowW-1,Math.max(0,Math.round(p.xNorm*(lowW-1))));
    const py=Math.min(lowH-1,Math.max(0,Math.round(p.yNorm*(lowH-1))));
    const key=px+','+py;
    const prev=bins.get(key);
    if(prev)prev.value+=1;
    else bins.set(key,{x:px,y:py,value:1});
  }
  const heatPoints=[...bins.values()];
  const maxVal=Math.max(...heatPoints.map(p=>p.value));
  if(maxVal<=0)return canvas;

  const radius=Math.max(22,Math.round(Math.min(lowW,lowH)*0.105));
  const blur=0.85;
  const shadow=document.createElement('canvas');
  shadow.width=lowW;shadow.height=lowH;
  const sctx=shadow.getContext('2d');

  const template=document.createElement('canvas');
  template.width=template.height=radius*2;
  const tctx=template.getContext('2d');
  const grad=tctx.createRadialGradient(radius,radius,radius*(1-blur),radius,radius,radius);
  grad.addColorStop(0,'rgba(0,0,0,1)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  tctx.fillStyle=grad;
  tctx.fillRect(0,0,radius*2,radius*2);

  // Draw alpha map: log scaling keeps one very hot cell from dominating the whole heatmap.
  const maxLog=Math.log1p(maxVal);
  for(const p of heatPoints){
    const intensity=Math.max(0.04,Math.min(1,Math.log1p(p.value)/maxLog));
    sctx.globalAlpha=intensity;
    sctx.drawImage(template,p.x-radius,p.y-radius);
  }
  sctx.globalAlpha=1;

  const img=sctx.getImageData(0,0,lowW,lowH);
  const data=img.data;
  let maxAlpha=0;
  for(let i=3;i<data.length;i+=4){if(data[i]>maxAlpha)maxAlpha=data[i]}
  if(maxAlpha===0)return canvas;

  // Colorize alpha map using the classic heatmap.js / GazeRecorder palette:
  // blue -> green -> yellow -> red.
  for(let i=0;i<data.length;i+=4){
    const alpha=data[i+3];
    const t=alpha/maxAlpha;
    if(t<0.045){data[i+3]=0;continue}
    const c=colorRamp(t);
    data[i]=c[0];data[i+1]=c[1];data[i+2]=c[2];
    data[i+3]=Math.min(235,Math.round(35+t*210));
  }
  ctx.putImageData(img,0,0);
  return canvas;
}

// Draw cached low-res heatmap canvas onto target canvas at display size.
function paintHeatmapToTarget(targetCanvas,lowResCanvas,displayW,displayH){
  targetCanvas.width=displayW;
  targetCanvas.height=displayH;
  const ctx=targetCanvas.getContext('2d');
  ctx.clearRect(0,0,displayW,displayH);
  if(!lowResCanvas)return;
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(lowResCanvas,0,0,displayW,displayH);
}

function buildSpssRow({sessionId,demographics,stimulus,session,aoiMetrics}){
  const g={'male':1,'female':2,'other':3}[demographics.gender]??0;
  const e={'high_school':1,'bachelor':2,'postgrad':3}[demographics.education]??0;
  const row={
    session_id:sessionId,participant_id:demographics.participantId,name:demographics.name,
    age:Number(demographics.age)||0,gender_code:g,education_code:e,
    stimulus_id:stimulus.order,stimulus_name:stimulus.name,stimulus_industry:stimulus.industry||'',stimulus_type:stimulus.type,
    stimulus_duration_ms:Math.round(session.videoDurationMs||0),
    total_samples:session.totalSamples||0,total_fixations:session.totalFixations||0,
    total_saccades:session.totalSaccades||0,
    sampling_rate_hz:Number(fmt(session.samplingRateHz,2)),
    mean_fix_dur_ms:Number(fmt(session.meanFixationDurMs,1)),
    median_fix_dur_ms:Number(fmt(session.medianFixationDurMs,1)),
    std_fix_dur_ms:Number(fmt(session.stdFixationDurMs,1)),
    fix_rate_per_sec:Number(fmt(session.fixationRatePerSec,2)),
    mean_saccade_amp:Number(fmt(session.meanSaccadeAmp,4)),
    scan_path_length:Number(fmt(session.scanPathLength,4)),
    engagement_pct:Number(fmt(session.engagementScore,2)),
    video_focus_pct:Number(fmt(session.videoFocus,2)),
    aoi_coverage_pct:Number(fmt(session.aoiCoverage,2)),
    ttff_ms:session.timeToFirstFixationMs??'',
    drop_off_ms:session.dropOffPointMs??'',
  };
  aoiMetrics.forEach((a,i)=>{
    const k=`aoi${i+1}`;
    row[`${k}_name`]=a.name;
    row[`${k}_active_start_s`]=a.startTime;
    row[`${k}_active_end_s`]=a.endTime;
    row[`${k}_dwell_ms`]=Math.round(a.totalDwellMs);
    row[`${k}_fix_count`]=a.fixationCount;
    row[`${k}_visit_count`]=a.visitCount;
    row[`${k}_revisits`]=a.revisitCount;
    row[`${k}_ttff_ms`]=a.timeToFirstFixationMs??'';
    row[`${k}_pct_time`]=Number(fmt(a.pctTimeOnAoi,2));
    row[`${k}_pct_time_active`]=Number(fmt(a.pctTimeOnAoiActive,2));
    row[`${k}_mean_fix_dur_ms`]=Number(fmt(a.meanFixationDurMs,1));
  });
  return row;
}

      ['Total Scan Path Length',fmt(r.session.scanPathLength,4)],

function exportToCSV({sessionId,demographics,stimulusResults}){
  const rows=stimulusResults.map(r=>buildSpssRow({sessionId,demographics,stimulus:r.stimulus,session:r.session,aoiMetrics:r.aois}));
  const headers=Array.from(new Set(rows.flatMap(r=>Object.keys(r))));
  const esc=v=>{if(v==null)return'';const s=String(v);if(s.includes(',')||s.includes('"')||s.includes('\n'))return`"${s.replace(/"/g,'""')}"`;return s};
  const csv=headers.join(',')+'\n'+rows.map(r=>headers.map(h=>esc(r[h])).join(',')).join('\n')+'\n';
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`eyelab_${sessionId}_spss.csv`;a.click();URL.revokeObjectURL(url);
}

function WelcomePhase({onNext,demographics,setDemographics}){
  const [requesting,setRequesting]=useState(false);
  const [cameraReady,setCameraReady]=useState(false);
  const [error,setError]=useState(null);
  const isFile=typeof window!=='undefined'&&window.location.protocol==='file:';
  const requestCamera=async()=>{setRequesting(true);setError(null);try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop());setCameraReady(true)}catch(e){setError('Không truy cập được webcam. Kiểm tra quyền trình duyệt.')}finally{setRequesting(false)}};

        <div className="panel p-6 space-y-5">
          <div><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Mã người tham gia</label><input className="input-base" value={demographics.participantId} onChange={e=>update('participantId',e.target.value)} /></div>
          <div className="grid grid-cols-2 gap-4">
            <div><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Tên đầy đủ <span className="text-[var(--danger)]">*</span></label><input className="input-base" value={demographics.name} onChange={e=>update('name',e.target.value)} placeholder="Nguyễn Văn A" /></div>
            <div><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Tuổi <span className="text-[var(--danger)]">*</span></label><input type="number" min="1" max="120" className="input-base" value={demographics.age} onChange={e=>update('age',e.target.value)} placeholder="22" /></div>
          </div>
          <div><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Giới tính <span className="text-[var(--danger)]">*</span></label>
            <div className="grid grid-cols-3 gap-2">{[['male','Nam'],['female','Nữ'],['other','Khác']].map(([k,v])=>(<div key={k} className={`radio-card font-mono ${demographics.gender===k?'selected':''}`} onClick={()=>update('gender',k)}>{v}</div>))}</div>
          </div>
          <div><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Trình độ học vấn <span className="text-[var(--danger)]">*</span></label>
            <div className="grid grid-cols-3 gap-2">{[['high_school','THPT'],['bachelor','Đại học'],['postgrad','Sau đại học']].map(([k,v])=>(<div key={k} className={`radio-card font-mono ${demographics.education===k?'selected':''}`} onClick={()=>update('education',k)}>{v}</div>))}</div>
          </div>
          <div><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Email (tuỳ chọn)</label><input className="input-base" value={demographics.email} onChange={e=>update('email',e.target.value)} placeholder="email@example.com" /></div>
          <div className="border-t border-[var(--border)] pt-4">
            <label className="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" checked={demographics.consent} onChange={e=>update('consent',e.target.checked)} className="mt-1 accent-[var(--accent)]" />
              <span className="text-xs text-[var(--text-2)] leading-relaxed">Tôi đồng ý tham gia nghiên cứu eye-tracking này. Tôi hiểu rằng webcam được dùng để ước tính điểm nhìn, dữ liệu xử lý cục bộ trên trình duyệt và xuất ra file cho mục đích nghiên cứu.</span>

  );
}

// ============================================================
// PHASE 02 — UPLOAD MULTI-STIMULUS
// ============================================================
function UploadPhase({onNext,stimuli,setStimuli,projectInfo,onProjectNameChange,onCreateProject,onSaveProject}){
  const [dragOver,setDragOver]=useState(false);
  const inputRef=useRef(null);
  const idCounterRef=useRef(stimuli.reduce((m,s)=>Math.max(m,s.id),0));

  const addFiles=async(files)=>{
    const arr=Array.from(files||[]).filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));
    if(!arr.length)return;
    const newOnes=[];
    for(const f of arr){
      const id=++idCounterRef.current;
      const dataUrl=await fileToDataURL(f);
      const url=dataUrl;
      const type=f.type.startsWith('image/')?'image':'video';
      let durationSec=DEFAULT_IMAGE_DURATION_SEC;
      if(type==='video'){
        // probe video duration
        try{
          durationSec=await new Promise((res)=>{
            const v=document.createElement('video');
            v.preload='metadata';v.muted=true;
            v.onloadedmetadata=()=>res(v.duration||DEFAULT_IMAGE_DURATION_SEC);
            v.onerror=()=>res(DEFAULT_IMAGE_DURATION_SEC);
            v.src=url;
            setTimeout(()=>res(DEFAULT_IMAGE_DURATION_SEC),5000);
          });
        }catch(e){durationSec=DEFAULT_IMAGE_DURATION_SEC}
      }
      newOnes.push({
        id,file:f,url,type,
        name:f.name.replace(/\.[^.]+$/,''),
        fileName:f.name,size:f.size,
        displayDurationSec:Math.round(durationSec*10)/10,
        industry:'',dataUrl,aois:[],gazeData:[],durationMs:0,
      });
    }
    setStimuli(prev=>{
      const merged=[...prev,...newOnes];
      return merged.map((s,i)=>({...s,order:i+1}));
    });
  };

  const remove=(id)=>{
    setStimuli(prev=>{
      const target=prev.find(s=>s.id===id);
      if(target){try{URL.revokeObjectURL(target.url)}catch(e){}}
      return prev.filter(s=>s.id!==id).map((s,i)=>({...s,order:i+1}));
    });
  };

  const move=(id,dir)=>{
    setStimuli(prev=>{
      const idx=prev.findIndex(s=>s.id===id);
      if(idx<0)return prev;
      const j=idx+dir;
      if(j<0||j>=prev.length)return prev;
      const next=[...prev];
      [next[idx],next[j]]=[next[j],next[idx]];
      return next.map((s,i)=>({...s,order:i+1}));
    });
  };

  const updateName=(id,name)=>setStimuli(prev=>prev.map(s=>s.id===id?{...s,name}:s));
  const updateIndustry=(id,industry)=>setStimuli(prev=>prev.map(s=>s.id===id?{...s,industry}:s));
  const updateDur=(id,sec)=>setStimuli(prev=>prev.map(s=>s.id===id?{...s,displayDurationSec:Math.max(1,Math.min(120,Number(sec)||1))}:s));

  const totalSec=stimuli.reduce((s,x)=>s+x.displayDurationSec,0);

  return(
    <div>
      <div className="font-mono text-[10px] text-[var(--accent)] uppercase tracking-[0.3em] mb-4">PHASE 02 / STIMULUS UPLOAD · MULTI</div>
      <h2 className="font-display text-4xl mb-2">Tải lên các <span className="italic text-[var(--accent)]">stimuli</span></h2>
      <p className="text-[var(--text-2)] mb-6 max-w-3xl">Tải lên một hoặc nhiều file <span className="font-mono text-[var(--accent)]">ảnh (PNG/JPG/WebP)</span> hoặc <span className="font-mono text-[var(--accent)]">video (MP4/WebM/MOV)</span>. Mỗi file là một stimulus riêng, được trình bày tuần tự với AOI, tên ngành và dữ liệu eye-tracking độc lập. File chỉ xử lý cục bộ trong IndexedDB.</p>

      <div className="panel p-4 mb-6">
        <div className="grid md:grid-cols-3 gap-3 items-end">
          <div className="md:col-span-2"><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Tên project</label><input className="input-base" value={projectInfo?.name||''} onChange={e=>onProjectNameChange?.(e.target.value)} placeholder="VD: AI Ads — ngành giày / mỹ phẩm" /></div>
          <div className="flex gap-2"><button onClick={onSaveProject} className="btn-ghost flex-1">Lưu project</button><button onClick={onCreateProject} className="btn-primary flex-1">+ Project mới</button></div>
        </div>
      </div>

      <div className={`drop-zone p-12 text-center cursor-pointer relative ${dragOver?'drag-over':''}`} onClick={()=>inputRef.current?.click()} onDragOver={e=>{e.preventDefault();setDragOver(true)}} onDragLeave={()=>setDragOver(false)} onDrop={e=>{e.preventDefault();setDragOver(false);addFiles(e.dataTransfer.files)}}>
        <div className="corner-tl"></div><div className="corner-tr"></div><div className="corner-bl"></div><div className="corner-br"></div>
        <input ref={inputRef} type="file" accept="image/*,video/*" multiple onChange={e=>{addFiles(e.target.files);e.target.value=''}} />
        <div className="font-mono text-[10px] text-[var(--text-3)] uppercase tracking-widest mb-3">INPUT / IMAGE_FILES · VIDEO_FILES</div>
        <div className="font-display text-2xl mb-1">{stimuli.length===0?'Kéo thả file vào đây':`+ Thêm stimulus`}</div>
        <div className="text-[var(--text-2)] text-sm">{stimuli.length===0?'hoặc click để chọn (cho phép chọn nhiều file)':'click hoặc kéo thả file thêm vào'}</div>
      </div>

      {stimuli.length>0&&(
        <div className="mt-6 panel">
          <div className="panel-header">
            <span>Stimulus Sequence</span>
            <span className="font-mono">{stimuli.length} files · ≈ {fmt(totalSec,0)}s tổng</span>
          </div>
          <div>
            {stimuli.map((s,i)=>(
              <div key={s.id} className="stim-row">
                <div className="font-mono text-[10px] text-[var(--text-3)] w-8">#{String(s.order).padStart(2,'0')}</div>
                {s.type==='image'?(<img src={s.url} className="stim-thumb" alt="" />):(<video src={s.url} className="stim-thumb" muted />)}
                <div className="flex-1 min-w-0 space-y-2">
                  <input className="input-base" value={s.name} onChange={e=>updateName(s.id,e.target.value)} placeholder="Tên stimulus" style={{padding:'6px 10px',fontSize:12}} />
                  <input className="input-base" value={s.industry||''} onChange={e=>updateIndustry(s.id,e.target.value)} placeholder="Tên ngành — VD: Footwear, Cosmetics, Food..." style={{padding:'6px 10px',fontSize:12}} />
                  <div className="font-mono text-[10px] text-[var(--text-3)] mt-1 truncate">{s.fileName} · {(s.size/1024/1024).toFixed(2)} MB · {s.type} · ngành: {s.industry||'—'}</div>
                </div>
                <div className="flex flex-col items-start gap-1">
                  <label className="font-mono text-[9px] text-[var(--text-3)] uppercase">{s.type==='image'?'Display (s)':'Length (s)'}</label>
                  <input type="number" min="1" max="120" step="0.5" disabled={s.type==='video'} value={s.displayDurationSec} onChange={e=>updateDur(s.id,e.target.value)} className="input-base" style={{padding:'4px 8px',fontSize:11,width:80}} />
                </div>
                <div className="flex flex-col gap-1">
                  <button onClick={()=>move(s.id,-1)} disabled={i===0} className="btn-ghost" style={{padding:'2px 8px',fontSize:11}}>↑</button>
                  <button onClick={()=>move(s.id,1)} disabled={i===stimuli.length-1} className="btn-ghost" style={{padding:'2px 8px',fontSize:11}}>↓</button>
                </div>
                <button onClick={()=>remove(s.id)} className="btn-danger" style={{padding:'6px 10px',fontSize:11}}>Xoá</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="mt-6 flex justify-between items-center gap-4">
        <div className="font-mono text-[10px] text-[var(--text-3)]">{stimuli.length===0?'Thêm ít nhất 1 stimulus để tiếp tục':`Sẵn sàng với ${stimuli.length} stimulus${stimuli.length>1?'s':''}`}</div>
        <div className="flex gap-2"><button onClick={onSaveProject} disabled={stimuli.length===0} className="btn-ghost">Lưu thay đổi</button><button onClick={onNext} disabled={stimuli.length===0} className="btn-primary">→ Tiếp tục đến AOI</button></div>
      </div>
    </div>
  );
}

// ============================================================
// PHASE 03 — CALIBRATION
// ============================================================
function CalibrationPhase({onNext,gazeReady,setGazeReady}){
  const [status,setStatus]=useState('idle');
  const [error,setError]=useState(null);
  const [calibrated,setCalibrated]=useState(false);
  const [started,setStarted]=useState(false);
  const [validationActive,setValidationActive]=useState(false);
  const [validationPointIndex,setValidationPointIndex]=useState(-1);
  const [validationMessage,setValidationMessage]=useState('');
  const [validationResult,setValidationResult]=useState(null);
  const [validationSkipped,setValidationSkipped]=useState(false);
  const validationSamplesRef=useRef([]);
  const validationPointRef=useRef(-1);
  const validationPointStartRef=useRef(0);
  const validationCollectingRef=useRef(false);
  const validationStartRef=useRef(0);

  const VALIDATION_POINTS=[
    {index:1,x:0.1,y:0.1,label:'1'}, {index:2,x:0.5,y:0.1,label:'2'}, {index:3,x:0.9,y:0.1,label:'3'},
    {index:4,x:0.1,y:0.5,label:'4'}, {index:5,x:0.5,y:0.5,label:'5'}, {index:6,x:0.9,y:0.5,label:'6'},
    {index:7,x:0.1,y:0.9,label:'7'}, {index:8,x:0.5,y:0.9,label:'8'}, {index:9,x:0.9,y:0.9,label:'9'},
  ];
  // Validation algorithm v2
  // Each target is visible a little longer, but only the stable window is used for accuracy.
  // Warm-up samples are exported for audit but excluded from Mean/Median Error.
  const VALIDATION_POINT_MS=2200;
  const VALIDATION_SETTLE_MS=900;
  const VALIDATION_END_GUARD_MS=150;
  const VALIDATION_MIN_VALID_PER_POINT=5;
  const VALIDATION_MAD_FACTOR=3;

  useEffect(()=>{
    document.body.classList.add('eyelab-calibrating');
    return ()=>document.body.classList.remove('eyelab-calibrating');
  },[]);

  const classifyValidation=useCallback((medianErrorPx,validPct,usablePointCount)=>{
    if(!Number.isFinite(medianErrorPx)||validPct<35||usablePointCount<5)return{label:'POOR',color:'var(--danger)',note:'Dữ liệu validation yếu — nên calibration lại hoặc cải thiện ánh sáng/vị trí ngồi.'};
    if(medianErrorPx<=70&&validPct>=70&&usablePointCount>=8)return{label:'GOOD',color:'var(--success)',note:'Đủ tốt cho phân tích AOI lớn trong quảng cáo. Thuật toán đã bỏ warm-up và dùng median gaze ổn định.'};
    if(medianErrorPx<=130&&validPct>=50&&usablePointCount>=6)return{label:'FAIR',color:'var(--accent)',note:'Có thể dùng cho AOI lớn, nhưng không nên dùng cho AOI nhỏ hoặc chữ quá nhỏ.'};
    return{label:'POOR',color:'var(--danger)',note:'Nên calibration lại trước khi chạy bài test chính.'};
  },[]);

  const meanOf=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
  const percentile=(arr,p)=>{
    const vals=arr.filter(Number.isFinite).sort((a,b)=>a-b);
    if(!vals.length)return null;
    const pos=(vals.length-1)*p;
    const base=Math.floor(pos),rest=pos-base;
    return vals[base+1]!==undefined?vals[base]+rest*(vals[base+1]-vals[base]):vals[base];
  };
  const madValue=(arr)=>{
    const vals=arr.filter(Number.isFinite);
    if(!vals.length)return 0;
    const med=median(vals);
    return median(vals.map(v=>Math.abs(v-med)));
  };
  const robustFilterSamples=(samples)=>{
    const vals=samples.filter(s=>Number.isFinite(s.errorPx));
    if(vals.length<VALIDATION_MIN_VALID_PER_POINT)return vals;
    const es=vals.map(s=>s.errorPx);
    const med=median(es);
    const mad=madValue(es);
    const minBand=45;
    const limit=mad>0?med+VALIDATION_MAD_FACTOR*1.4826*mad:med+minBand;
    const threshold=Math.max(med+minBand,limit);
    return vals.filter(s=>s.errorPx<=threshold);
  };

  const computeValidationResult=useCallback((samples,startMs,endMs)=>{
    const durationMs=Math.max(1,endMs-startMs);
    const analysisSamples=samples.filter(s=>s.phase==='analysis');
    const validAnalysisSamples=analysisSamples.filter(s=>s.valid&&Number.isFinite(s.errorPx));
    const sampleErrors=validAnalysisSamples.map(s=>s.errorPx);
    const pointMetrics=VALIDATION_POINTS.map(p=>{
      const all=samples.filter(s=>s.pointIndex===p.index);
      const analysis=all.filter(s=>s.phase==='analysis');
      const vals=analysis.filter(s=>s.valid&&Number.isFinite(s.errorPx));
      const robust=robustFilterSamples(vals);
      const es=vals.map(s=>s.errorPx);
      const robustEs=robust.map(s=>s.errorPx);
      const targetXPx=p.x*window.innerWidth;
      const targetYPx=p.y*window.innerHeight;
      const medianGazeXPx=robust.length?median(robust.map(s=>s.gazeXPx)):null;
      const medianGazeYPx=robust.length?median(robust.map(s=>s.gazeYPx)):null;
      const pointErrorPx=(Number.isFinite(medianGazeXPx)&&Number.isFinite(medianGazeYPx))?Math.hypot(medianGazeXPx-targetXPx,medianGazeYPx-targetYPx):null;
      const precisionPx=robust.length&&Number.isFinite(medianGazeXPx)&&Number.isFinite(medianGazeYPx)?median(robust.map(s=>Math.hypot(s.gazeXPx-medianGazeXPx,s.gazeYPx-medianGazeYPx))):null;
      return{
        point:p.index,targetXNorm:p.x,targetYNorm:p.y,targetXPx:Math.round(targetXPx),targetYPx:Math.round(targetYPx),
        totalSamples:all.length,analysisSamples:analysis.length,validSamples:vals.length,usedSamples:robust.length,
        validPct:analysis.length?vals.length/analysis.length*100:0,usedPct:analysis.length?robust.length/analysis.length*100:0,
        meanErrorPx:meanOf(es),medianErrorPx:es.length?median(es):null,maxErrorPx:es.length?Math.max(...es):null,
        robustMeanErrorPx:meanOf(robustEs),robustMedianErrorPx:robustEs.length?median(robustEs):null,
        pointErrorPx,precisionPx,
        medianGazeXPx,medianGazeYPx,
        biasXPx:Number.isFinite(medianGazeXPx)?medianGazeXPx-targetXPx:null,
        biasYPx:Number.isFinite(medianGazeYPx)?medianGazeYPx-targetYPx:null,
      };
    });
    const pointErrors=pointMetrics.map(p=>p.pointErrorPx).filter(Number.isFinite);
    const precisionVals=pointMetrics.map(p=>p.precisionPx).filter(Number.isFinite);
    const meanErrorPx=meanOf(pointErrors);
    const medianErrorPx=pointErrors.length?median(pointErrors):null;
    const maxErrorPx=pointErrors.length?Math.max(...pointErrors):null;
    const sampleMeanErrorPx=meanOf(sampleErrors);
    const sampleMedianErrorPx=sampleErrors.length?median(sampleErrors):null;
    const sampleP75ErrorPx=percentile(sampleErrors,0.75);
    const validPct=analysisSamples.length?validAnalysisSamples.length/analysisSamples.length*100:0;
    const sampleRateHz=samples.length/(durationMs/1000);
    const usablePointCount=pointErrors.length;
    const quality=classifyValidation(medianErrorPx,validPct,usablePointCount);
    const avgPrecisionPx=meanOf(precisionVals);
    return{
      id:'VAL-'+new Date().toISOString().replace(/[:.]/g,'-'),
      createdAt:new Date().toISOString(),algorithmVersion:'v2-stable-window-median',
      screenWidth:window.innerWidth,screenHeight:window.innerHeight,devicePixelRatio:window.devicePixelRatio,
      pointDurationMs:VALIDATION_POINT_MS,settleDiscardMs:VALIDATION_SETTLE_MS,endGuardDiscardMs:VALIDATION_END_GUARD_MS,
      totalSamples:samples.length,analysisSamples:analysisSamples.length,validSamples:validAnalysisSamples.length,validPct,trackingLossPct:100-validPct,
      durationMs,sampleRateHz,usablePointCount,
      meanErrorPx,medianErrorPx,maxErrorPx,avgPrecisionPx,
      sampleMeanErrorPx,sampleMedianErrorPx,sampleP75ErrorPx,
      quality,pointMetrics,samples,
    };
  },[classifyValidation]);

  const recordValidationSample=useCallback((data)=>{
    if(!validationCollectingRef.current)return;
    const idx=validationPointRef.current;
    if(idx<1)return;
    const p=VALIDATION_POINTS[idx-1];
    const now=performance.now();
    const elapsed=now-validationPointStartRef.current;
    const rawX=Number(data?.docX??data?.GazeX??data?.x);
    const rawY=Number(data?.docY??data?.GazeY??data?.y);
    const xPx=rawX-window.scrollX;
    const yPx=rawY-window.scrollY;
    const state=data?.state;
    const coordOk=Number.isFinite(xPx)&&Number.isFinite(yPx);
    const trackingOk=state!==-1&&state!==undefined;
    const phase=elapsed<VALIDATION_SETTLE_MS?'warmup':(elapsed>VALIDATION_POINT_MS-VALIDATION_END_GUARD_MS?'end_guard':'analysis');
    const valid=coordOk&&trackingOk;
    const targetXPx=p.x*window.innerWidth;
    const targetYPx=p.y*window.innerHeight;
    const xNorm=coordOk?xPx/window.innerWidth:null;
    const yNorm=coordOk?yPx/window.innerHeight:null;
    const errorPx=valid?Math.hypot(xPx-targetXPx,yPx-targetYPx):null;
    const errorNorm=valid?Math.hypot(xNorm-p.x,yNorm-p.y):null;
    validationSamplesRef.current.push({
      pointIndex:p.index,pointLabel:p.label,targetXNorm:p.x,targetYNorm:p.y,targetXPx,targetYPx,
      elapsedMs:now-validationStartRef.current,pointElapsedMs:elapsed,phase,usedForAnalysis:valid&&phase==='analysis',
      gazeXPx:coordOk?xPx:null,gazeYPx:coordOk?yPx:null,gazeXNorm:xNorm,gazeYNorm:yNorm,
      errorPx,errorNorm,valid,state:state??'',
    });
  },[]);

  const configureCallbacks=useCallback(()=>{
    if(!window.GazeCloudAPI)return false;
    try{
      GazeCloudAPI.UseClickRecalibration=false;
      GazeCloudAPI.CalibrationType=0;
      GazeCloudAPI.OnResult=function(){};
      GazeCloudAPI.OnCalibrationComplete=function(){
        setStatus('done');setCalibrated(true);setGazeReady(true);
        try{document.getElementById('camid')&&(document.getElementById('camid').style.display='none')}catch(e){}
      };
      GazeCloudAPI.OnCalibrationFail=function(){setStatus('failed');setError('Calibration failed. Kiểm tra ánh sáng/vị trí mặt rồi chạy lại.');};
      GazeCloudAPI.OnCamDenied=function(){setStatus('failed');setError('Trình duyệt chưa cấp quyền webcam.');};
      GazeCloudAPI.OnError=function(msg){setStatus('failed');setError(String(msg||'GazeCloudAPI error'));};
      return true;
    }catch(e){setError(String(e));return false}
  },[setGazeReady]);

  const startGazeCloud=useCallback(()=>{
    setError(null);setValidationSkipped(false);setValidationResult(null);
    if(!window.GazeCloudAPI){setError('Không tải được GazeCloudAPI.js');return}
    if(!configureCallbacks())return;
    setStarted(true);setStatus('starting');
    try{
      GazeCloudAPI.StartEyeTracking();
      setStatus('waiting_camera');
      setTimeout(()=>{try{GazeCloudAPI.ShowCalibration();setStatus('calibrating')}catch(e){setError(String(e))}},1800);
    }catch(e){setStatus('failed');setError(String(e));}
  },[configureCallbacks]);

  const showNativeCalibration=useCallback(()=>{
    if(!window.GazeCloudAPI){setError('Không tải được GazeCloudAPI.js');return}
    setValidationSkipped(false);setValidationResult(null);
    configureCallbacks();
    try{GazeCloudAPI.ShowCalibration();setStatus('calibrating')}catch(e){setError(String(e))}
  },[configureCallbacks]);

  const stop=useCallback(()=>{try{window.GazeCloudAPI?.StopEyeTracking?.()}catch(e){};setStatus('stopped')},[]);

  const startValidation=useCallback(async()=>{
    if(!window.GazeCloudAPI){setError('Không tải được GazeCloudAPI.js');return}
    if(!calibrated&&!gazeReady){setError('Cần hoàn tất calibration trước khi chạy validation.');return}
    setError(null);setValidationSkipped(false);setValidationResult(null);
    validationSamplesRef.current=[];
    validationPointRef.current=-1;
    validationCollectingRef.current=false;
    validationStartRef.current=performance.now();
    setValidationActive(true);
    setValidationPointIndex(-1);
    setValidationMessage('Chuẩn bị validation — hãy nhìn vào từng chấm đỏ khi nó xuất hiện.');
    try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}
    try{GazeCloudAPI.OnResult=recordValidationSample}catch(e){}
    await sleep(1200);
    for(const p of VALIDATION_POINTS){
      validationPointRef.current=p.index;
      validationPointStartRef.current=performance.now();
      validationCollectingRef.current=true;
      setValidationPointIndex(p.index-1);
      setValidationMessage(`Point ${p.index}/9 · nhìn vào chấm đỏ`);
      await sleep(VALIDATION_POINT_MS);
      validationCollectingRef.current=false;
    }
    const end=performance.now();
    const result=computeValidationResult([...validationSamplesRef.current],validationStartRef.current,end);
    setValidationPointIndex(-1);
    setValidationMessage('Validation hoàn tất.');
    setValidationActive(false);
    setValidationResult(result);
    try{window.EyeLabLastValidationResult=result;localStorage.setItem('eyelab_last_validation_result',JSON.stringify(result))}catch(e){}
    try{GazeCloudAPI.OnResult=function(){}}catch(e){}
    try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  },[calibrated,gazeReady,recordValidationSample,computeValidationResult]);

  const skipValidation=useCallback(()=>{
    setValidationSkipped(true);
    setValidationResult(null);
    onNext();
  },[onNext]);

  const exportValidationCsv=useCallback(()=>{
    const r=validationResult;if(!r)return;
    const headers=['validation_id','created_at','algorithm_version','point','target_x_norm','target_y_norm','target_x_px','target_y_px','elapsed_ms','point_elapsed_ms','phase','used_for_analysis','gaze_x_px','gaze_y_px','gaze_x_norm','gaze_y_norm','error_px','error_norm','valid','state'];
    const lines=[headers.join(',')];
    const esc=v=>v==null?'':String(v).includes(',')?`"${String(v).replace(/"/g,'""')}"`:String(v);
    r.samples.forEach(s=>lines.push([r.id,r.createdAt,r.algorithmVersion,s.pointIndex,s.targetXNorm,s.targetYNorm,Math.round(s.targetXPx),Math.round(s.targetYPx),Math.round(s.elapsedMs),Math.round(s.pointElapsedMs),s.phase,s.usedForAnalysis?1:0,s.gazeXPx==null?'':Math.round(s.gazeXPx),s.gazeYPx==null?'':Math.round(s.gazeYPx),fmt(s.gazeXNorm,5),fmt(s.gazeYNorm,5),s.errorPx==null?'':fmt(s.errorPx,2),s.errorNorm==null?'':fmt(s.errorNorm,5),s.valid?1:0,s.state].map(esc).join(',')));
    downloadBlob(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8;'}),`eyelab_validation_${r.id}.csv`);
  },[validationResult]);

  const exportValidationExcel=useCallback(()=>{
    const r=validationResult;if(!r)return;
    const wb=XLSX.utils.book_new();
    const summary=[
      ['Validation ID',r.id],['Created At',r.createdAt],['Algorithm Version',r.algorithmVersion],['Screen Width',r.screenWidth],['Screen Height',r.screenHeight],['Device Pixel Ratio',r.devicePixelRatio],
      ['Point Duration ms',r.pointDurationMs],['Warm-up Discard ms',r.settleDiscardMs],['End Guard Discard ms',r.endGuardDiscardMs],
      ['Total Samples',r.totalSamples],['Analysis Samples',r.analysisSamples],['Valid Analysis Samples',r.validSamples],['Valid %',fmt(r.validPct,2)],['Tracking Loss %',fmt(r.trackingLossPct,2)],['Sample Rate Hz',fmt(r.sampleRateHz,2)],
      ['Point Median Mean Error px',fmt(r.meanErrorPx,2)],['Point Median Median Error px',fmt(r.medianErrorPx,2)],['Point Median Max Error px',fmt(r.maxErrorPx,2)],['Avg Precision px',fmt(r.avgPrecisionPx,2)],['Sample Median Error px',fmt(r.sampleMedianErrorPx,2)],['Quality',r.quality.label],['Note',r.quality.note],
    ];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),'Summary');
    const pointHeaders=['point','target_x_norm','target_y_norm','target_x_px','target_y_px','total_samples','analysis_samples','valid_samples','used_samples','valid_pct','sample_mean_error_px','sample_median_error_px','point_error_px','precision_px','median_gaze_x_px','median_gaze_y_px','bias_x_px','bias_y_px','max_error_px'];
    const pointRows=r.pointMetrics.map(p=>[p.point,p.targetXNorm,p.targetYNorm,p.targetXPx,p.targetYPx,p.totalSamples,p.analysisSamples,p.validSamples,p.usedSamples,fmt(p.validPct,2),fmt(p.meanErrorPx,2),fmt(p.medianErrorPx,2),fmt(p.pointErrorPx,2),fmt(p.precisionPx,2),fmt(p.medianGazeXPx,2),fmt(p.medianGazeYPx,2),fmt(p.biasXPx,2),fmt(p.biasYPx,2),fmt(p.maxErrorPx,2)]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([pointHeaders,...pointRows]),'Point Metrics');
    const rawHeaders=['point','target_x_norm','target_y_norm','target_x_px','target_y_px','elapsed_ms','point_elapsed_ms','phase','used_for_analysis','gaze_x_px','gaze_y_px','gaze_x_norm','gaze_y_norm','error_px','error_norm','valid','state'];
    const rawRows=r.samples.map(s=>[s.pointIndex,s.targetXNorm,s.targetYNorm,Math.round(s.targetXPx),Math.round(s.targetYPx),Math.round(s.elapsedMs),Math.round(s.pointElapsedMs),s.phase,s.usedForAnalysis?1:0,s.gazeXPx==null?'':Math.round(s.gazeXPx),s.gazeYPx==null?'':Math.round(s.gazeYPx),fmt(s.gazeXNorm,5),fmt(s.gazeYNorm,5),s.errorPx==null?'':fmt(s.errorPx,2),s.errorNorm==null?'':fmt(s.errorNorm,5),s.valid?1:0,s.state]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([rawHeaders,...rawRows]),'Raw Samples');
    XLSX.writeFile(wb,`eyelab_validation_${r.id}.xlsx`);
  },[validationResult]);

  const activePoint=validationPointIndex>=0?VALIDATION_POINTS[validationPointIndex]:null;

  return(
    <div>
      {validationActive&&(
        <div className="fixed inset-0 bg-white text-black z-[25000] cursor-none overflow-hidden">
          <div className="fixed top-6 left-6 font-mono text-xs text-black/60">EyeLab Validation · {validationMessage}</div>
          <div className="fixed top-6 right-6 font-mono text-xs text-black/60">Mỗi điểm: 2.2s · chỉ tính cửa sổ ổn định sau 0.9s</div>
          {activePoint?(
            <div>
              <div className="absolute rounded-full" style={{left:`calc(${activePoint.x*100}% - 22px)`,top:`calc(${activePoint.y*100}% - 22px)`,width:44,height:44,border:'3px solid rgba(239,68,68,.35)'}}></div>
              <div className="absolute rounded-full" style={{left:`calc(${activePoint.x*100}% - 9px)`,top:`calc(${activePoint.y*100}% - 9px)`,width:18,height:18,background:'#ef4444',boxShadow:'0 0 0 12px rgba(239,68,68,.16), 0 0 30px rgba(239,68,68,.45)'}}></div>
              <div className="absolute font-mono text-[11px] text-black/50" style={{left:`calc(${activePoint.x*100}% + 22px)`,top:`calc(${activePoint.y*100}% + 18px)`}}>P{activePoint.index} · ({activePoint.x}, {activePoint.y})</div>
            </div>
          ):(
            <div className="h-full w-full flex items-center justify-center text-center">
              <div>
                <div className="font-display text-5xl mb-4">Validation</div>
                <div className="font-mono text-sm text-black/60">Nhìn lần lượt vào 9 chấm đỏ. Giữ đầu cố định.</div>
              </div>
            </div>
          )}
        </div>
      )}

      <div className="font-mono text-[10px] text-[var(--accent)] uppercase tracking-[0.3em] mb-4">PHASE 03 / CALIBRATION + VALIDATION</div>
      <h2 className="font-display text-4xl mb-2">Hiệu chuẩn & <span className="italic text-[var(--accent)]">Validation</span></h2>
      <p className="text-[var(--text-2)] mb-6 max-w-3xl">Sau khi calibration xong, bạn có thể chạy thêm validation 9 điểm để kiểm tra sai số gaze. Nếu không cần kiểm tra, có thể skip validation và đi thẳng vào bài test.</p>
      <div className="grid grid-cols-12 gap-6">
        <div className="col-span-12 lg:col-span-7">
          <div className="panel p-6 space-y-5">
            <div className="flex items-center gap-3"><div className={`w-2 h-2 rounded-full ${window.GazeCloudAPI?'bg-[var(--success)]':'bg-[var(--danger)]'}`}></div><div className="font-mono text-xs">{window.GazeCloudAPI?<span className="text-[var(--success)]">✓ GazeCloudAPI đã tải</span>:<span className="text-[var(--danger)]">GazeCloudAPI chưa tải</span>}</div></div>
            <div className="grid grid-cols-2 gap-3"><Stat label="Engine" value="GazeCloudAPI" mono /><Stat label="Status" value={status.toUpperCase()} mono color={calibrated?'var(--success)':undefined} /></div>
            {error&&<div className="text-[var(--danger)] text-sm font-mono border border-[rgba(239,68,68,.35)] p-3">{error}</div>}
            <div className="flex gap-3 flex-wrap">
              <button onClick={startGazeCloud} disabled={status==='starting'||status==='calibrating'} className="btn-primary">● Khởi động & Calibration</button>
              <button onClick={showNativeCalibration} disabled={!started} className="btn-ghost">↻ Mở lại calibration</button>
              <button onClick={stop} className="btn-danger">Dừng tracking</button>
            </div>
            {(calibrated||gazeReady)&&<div className="font-mono text-xs text-[var(--success)]">✓ Calibration hoàn tất. Bây giờ có thể chạy validation hoặc skip.</div>}
          </div>

          <div className="panel p-6 mt-6 space-y-5">
            <div className="panel-header" style={{margin:'-24px -24px 20px -24px'}}><span>Validation Mode</span><span>9-point · stable-window</span></div>
            <div className="grid grid-cols-3 gap-3">
              <Stat label="Validation" value={validationResult?'DONE':validationSkipped?'SKIPPED':'NOT RUN'} mono color={validationResult?'var(--success)':validationSkipped?'var(--accent)':undefined} />
              <Stat label="Median Error" value={validationResult?fmt(validationResult.medianErrorPx,1)+' px':'—'} mono color={validationResult?.quality?.color} />
              <Stat label="Quality" value={validationResult?validationResult.quality.label:'—'} mono color={validationResult?.quality?.color} />
            </div>
            <div className="text-sm text-[var(--text-2)] leading-relaxed">Validation sẽ hiện 9 chấm đỏ tại tọa độ cố định: (0.1,0.1), (0.5,0.1), …, (0.9,0.9). Bản v2 bỏ warm-up đầu mỗi điểm, loại outlier bằng MAD và tính sai số chính bằng median gaze ổn định của từng điểm.</div>
            {validationResult&&(
              <div className="border border-[var(--border)] p-4 bg-[var(--bg)] space-y-3">
                <div className="font-mono text-xs" style={{color:validationResult.quality.color}}>● {validationResult.quality.label}: {validationResult.quality.note}</div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                  <Stat label="Mean Error" value={fmt(validationResult.meanErrorPx,1)+' px'} mono />
                  <Stat label="Valid Samples" value={fmt(validationResult.validPct,1)+'%'} mono />
                  <Stat label="Sample Rate" value={fmt(validationResult.sampleRateHz,1)+' Hz'} mono />
                  <Stat label="Analysis Samples" value={validationResult.analysisSamples} mono />
                </div>
                <div className="flex gap-2 flex-wrap"><button onClick={exportValidationExcel} className="btn-ghost">Tải Excel validation</button><button onClick={exportValidationCsv} className="btn-ghost">Tải CSV validation</button></div>
              </div>
            )}
            <div className="flex gap-3 flex-wrap">
              <button onClick={startValidation} disabled={!calibrated&&!gazeReady||validationActive} className="btn-primary">◎ Chạy validation 9 điểm</button>
              <button onClick={skipValidation} disabled={!calibrated&&!gazeReady} className="btn-ghost">Skip validation & bắt đầu test</button>
              <button onClick={onNext} disabled={!calibrated&&!gazeReady} className="btn-primary">→ Bắt đầu test</button>
            </div>
          </div>
        </div>
        <div className="col-span-12 lg:col-span-5"><div className="panel"><div className="panel-header"><span>Lưu ý khi dùng GazeCloudAPI</span><span>/ IMPORTANT</span></div><div className="p-5 text-sm text-[var(--text-2)] leading-relaxed space-y-3"><p>1. Nên chạy web bằng HTTP/HTTPS, không mở trực tiếp bằng file://.</p><p>2. Validation phù hợp để chứng minh hệ thống đủ tin cậy cho phân tích AOI lớn, không phải để đo chính xác từng chữ nhỏ.</p><p>3. Sau calibration, web thu gaze qua <span className="font-mono text-[var(--accent)]">GazeData.docX/docY</span>; validation quy đổi về tọa độ viewport và so với điểm thật.</p></div></div></div>
      </div>
    </div>
  );
}

// ============================================================
// PHASE 04 — AOI (multi-stimulus, with stimulus selector)
// ============================================================
function AoiPhase({onNext,stimuli,updateStimulus,onEditStimuli,onCreateProject,onSaveProject,projectInfo,onProjectNameChange}){
  const [activeIdx,setActiveIdx]=useState(0);
  // Admin AOI editing does not need live gaze tracking.
  useEffect(()=>{},[]);

  const stim=stimuli[activeIdx];
  if(!stim)return null;

  const allHaveAoi=stimuli.every(s=>s.aois.length>0);

  return(
    <div>
      <div className="font-mono text-[10px] text-[var(--accent)] uppercase tracking-[0.3em] mb-4">PHASE 04 / AREAS OF INTEREST · {stimuli.length} STIMULI</div>
      <h2 className="font-display text-4xl mb-2">Định nghĩa vùng quan tâm</h2>
      <p className="text-[var(--text-2)] mb-4">Định nghĩa AOI cho <span className="text-[var(--accent)]">từng stimulus</span>. Vẽ AOI bằng cách kéo chuột trên ảnh/video. Với video, có thể giới hạn thời gian xuất hiện cho từng AOI.</p>
      <div className="panel p-4 mb-6">
        <div className="grid md:grid-cols-3 gap-3 items-end">
          <div className="md:col-span-2"><label className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest block mb-2">Project hiện tại</label><input className="input-base" value={projectInfo?.name||''} onChange={e=>onProjectNameChange?.(e.target.value)} /></div>
          <div className="flex gap-2"><button onClick={onEditStimuli} className="btn-ghost flex-1">Sửa / xoá stimulus</button><button onClick={onCreateProject} className="btn-primary flex-1">+ Project mới</button></div>
        </div>
      </div>

      {/* Stimulus tabs */}
      <div className="flex gap-2 mb-6 flex-wrap">
        {stimuli.map((s,i)=>(
          <button key={s.id} onClick={()=>setActiveIdx(i)} className={`stim-tab ${i===activeIdx?'active':''} ${s.aois.length>0?'done':''}`}>
            #{s.order} {s.name.slice(0,16)}{s.name.length>16?'…':''} {s.aois.length>0?`✓ ${s.aois.length}`:''}
          </button>
        ))}
      </div>

      <AoiEditor key={stim.id} stimulus={stim} onChange={(aois)=>updateStimulus(stim.id,{aois})} />

      <div className="mt-8 flex justify-between items-center">
        <div className="flex gap-2">
          <button onClick={()=>setActiveIdx(Math.max(0,activeIdx-1))} disabled={activeIdx===0} className="btn-ghost">← Stimulus trước</button>
          <button onClick={()=>setActiveIdx(Math.min(stimuli.length-1,activeIdx+1))} disabled={activeIdx===stimuli.length-1} className="btn-ghost">Stimulus sau →</button>
        </div>
        <div className="flex gap-3 items-center">
          <div className="font-mono text-[10px] text-[var(--text-3)]">{allHaveAoi?'✓ Tất cả stimuli đã có AOI':`${stimuli.filter(s=>s.aois.length>0).length}/${stimuli.length} stimuli có AOI`}</div>
          <button onClick={onSaveProject} className="btn-ghost">Lưu project</button>
          <button onClick={onNext} disabled={!allHaveAoi} className="btn-primary">→ Hoàn tất setup</button>
        </div>
      </div>
    </div>
  );
}

function AoiEditor({stimulus,onChange}){
  const mediaRef=useRef(null);
  const canvasRef=useRef(null);
  const [draft,setDraft]=useState(null);
  const [dragging,setDragging]=useState(false);
  const [aoiName,setAoiName]=useState('');
  const [currentTime,setCurrentTime]=useState(0);
  const [mediaDur,setMediaDur]=useState(stimulus.type==='image'?stimulus.displayDurationSec:0);
  const colors=['#F59E0B','#06B6D4','#10B981','#EC4899','#8B5CF6','#EF4444'];
  const aois=stimulus.aois;

  useEffect(()=>{
    if(stimulus.type==='image'){setMediaDur(stimulus.displayDurationSec);return}
    const v=mediaRef.current;if(!v)return;
    const onTime=()=>setCurrentTime(v.currentTime);
    const onLoad=()=>setMediaDur(v.duration);
    v.addEventListener('timeupdate',onTime);v.addEventListener('loadedmetadata',onLoad);
    return()=>{v.removeEventListener('timeupdate',onTime);v.removeEventListener('loadedmetadata',onLoad)};
  },[stimulus.id,stimulus.type]);

  const getPos=e=>{const r=canvasRef.current.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
  const onMD=e=>{const p=getPos(e);setDragging(true);setDraft({x0:p.x,y0:p.y,x1:p.x,y1:p.y})};
  const onMM=e=>{if(!dragging)return;const p=getPos(e);setDraft(d=>({...d,x1:p.x,y1:p.y}))};
  const onMU=()=>{setDragging(false);if(draft){const x=Math.min(draft.x0,draft.x1),y=Math.min(draft.y0,draft.y1),w=Math.abs(draft.x1-draft.x0),h=Math.abs(draft.y1-draft.y0);if(w>0.01&&h>0.01)setDraft({x,y,w,h,pending:true});else setDraft(null)}};

  const saveDraft=()=>{
    if(!draft||!aoiName.trim())return;
    const newA={id:aois.length+1,name:aoiName.trim(),x:draft.x,y:draft.y,w:draft.w,h:draft.h,startTime:0,endTime:mediaDur||stimulus.displayDurationSec};
    onChange([...aois,newA]);
    setDraft(null);setAoiName('');
  };
  const removeAoi=id=>onChange(aois.filter(a=>a.id!==id));
  const updateAoiTime=(id,field,value)=>onChange(aois.map(a=>{if(a.id!==id)return a;const nv=Math.max(0,Math.min(mediaDur,Number(value)||0));if(field==='startTime'&&nv>=a.endTime)return a;if(field==='endTime'&&nv<=a.startTime)return a;return{...a,[field]:nv}}));
