  const setAoiTimeFromVideo=(id,field)=>updateAoiTime(id,field,currentTime);

  const activeNow=stimulus.type==='video'?aois.filter(a=>currentTime>=a.startTime&&currentTime<=a.endTime):aois;

  return(
    <div className="grid grid-cols-12 gap-6">
      <div className="col-span-12 lg:col-span-8">
        <div className="panel">
          <div className="panel-header">
            <span>Stimulus #{stimulus.order} · {stimulus.name} · ngành: {stimulus.industry||'—'}</span>
            <span className="font-mono">{stimulus.type==='video'?`t = ${fmt(currentTime,2)}s / ${fmt(mediaDur,2)}s · `:''}{stimulus.type==='image'?`Display ${fmt(stimulus.displayDurationSec,1)}s · `:''}Active AOIs: {activeNow.length}</span>
          </div>
          <div ref={canvasRef} className="relative bg-black select-none" style={{cursor:'crosshair'}} onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={()=>dragging&&onMU()}>
            {stimulus.type==='video'?(
              <video ref={mediaRef} src={stimulus.url} controls className="block w-full pointer-events-auto" style={{maxHeight:'60vh'}} onPlay={e=>e.target.pause()} />
            ):(
              <img ref={mediaRef} src={stimulus.url} alt="" className="block w-full pointer-events-none" style={{maxHeight:'60vh',objectFit:'contain'}} draggable={false} />
            )}
            <div className="absolute inset-0 pointer-events-none">
              {aois.map((a,i)=>{const active=stimulus.type==='image'?true:(currentTime>=a.startTime&&currentTime<=a.endTime);return(<div key={a.id} className="absolute" style={{left:`${a.x*100}%`,top:`${a.y*100}%`,width:`${a.w*100}%`,height:`${a.h*100}%`,border:`2px ${active?'solid':'dashed'} ${colors[i%colors.length]}`,backgroundColor:active?colors[i%colors.length]+'15':'transparent',opacity:active?1:0.4}}><div className="absolute -top-6 left-0 font-mono text-[10px] px-2 py-0.5 text-black font-bold" style={{background:colors[i%colors.length]}}>{a.name} {!active&&'(inactive)'}</div></div>)})}
              {draft&&(<div className="absolute border-2 border-dashed" style={{left:`${(draft.x??Math.min(draft.x0,draft.x1))*100}%`,top:`${(draft.y??Math.min(draft.y0,draft.y1))*100}%`,width:`${(draft.w??Math.abs(draft.x1-draft.x0))*100}%`,height:`${(draft.h??Math.abs(draft.y1-draft.y0))*100}%`,borderColor:'var(--accent)',backgroundColor:'rgba(245,158,11,0.1)'}} />)}
            </div>
          </div>
        </div>
        <div className="font-mono text-[10px] text-[var(--text-3)] mt-2 uppercase tracking-widest">ℹ {stimulus.type==='video'?'AOI nét đứt = không active tại thời điểm hiện tại':'Với ảnh, AOI luôn active suốt thời lượng hiển thị'}</div>

        {stimulus.type==='video'&&aois.length>0&&mediaDur>0&&(
          <div className="panel mt-4">
            <div className="panel-header"><span>AOI Activity Timeline</span><span className="font-mono">0s — {fmt(mediaDur,1)}s</span></div>
            <div className="p-4 space-y-2">
              {aois.map((a,i)=>(
                <div key={a.id} className="flex items-center gap-2">
                  <div className="w-20 font-mono text-[10px] truncate text-right">{a.name}</div>
                  <div className="flex-1 relative h-5 bg-[var(--bg)] border border-[var(--border)]">
                    <div className="absolute h-full" style={{left:`${(a.startTime/mediaDur)*100}%`,width:`${((a.endTime-a.startTime)/mediaDur)*100}%`,background:colors[i%colors.length]+'80'}}></div>
                    <div className="absolute h-full w-px bg-[var(--accent)]" style={{left:`${(currentTime/mediaDur)*100}%`}}></div>
                  </div>
                  <div className="w-32 font-mono text-[10px] text-[var(--text-2)]">{fmtTime(a.startTime)} → {fmtTime(a.endTime)}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div className="col-span-12 lg:col-span-4">
        <div className="panel">
          <div className="panel-header"><span>New AOI</span><span>/ DRAFT</span></div>
          <div className="p-5">
            {draft&&draft.pending?(
              <div className="space-y-3">
                <div className="font-mono text-[10px] text-[var(--text-2)] uppercase tracking-widest">Đã vẽ — {fmt(draft.w*100,1)}% × {fmt(draft.h*100,1)}%</div>
                <input type="text" value={aoiName} onChange={e=>setAoiName(e.target.value)} placeholder="Logo, Headline, CTA..." className="input-base" autoFocus onKeyDown={e=>e.key==='Enter'&&saveDraft()} />
                <div className="flex gap-2">
                  <button onClick={saveDraft} disabled={!aoiName.trim()} className="btn-primary flex-1">+ Lưu AOI</button>
                  <button onClick={()=>{setDraft(null);setAoiName('')}} className="btn-ghost">✕</button>
                </div>
              </div>
            ):(<div className="text-[var(--text-3)] text-sm font-mono text-center py-4">[kéo chuột trên {stimulus.type==='image'?'ảnh':'video'} để vẽ]</div>)}
          </div>
        </div>

        <div className="panel mt-4">
          <div className="panel-header"><span>Defined AOIs</span><span className="font-mono">N = {aois.length}</span></div>
          <div className="max-h-[500px] overflow-y-auto">
            {aois.length===0?(<div className="p-6 text-center text-[var(--text-3)] text-sm font-mono">Chưa có AOI nào</div>):aois.map((a,i)=>(
              <div key={a.id} className="px-4 py-3 border-b border-[var(--border)] last:border-b-0">
                <div className="flex items-center gap-2 mb-2">
                  <div className="w-3 h-3" style={{background:colors[i%colors.length]}}></div>
                  <div className="text-sm font-medium flex-1">{a.name}</div>
                  <button onClick={()=>removeAoi(a.id)} className="text-[var(--text-3)] hover:text-[var(--danger)] text-lg">×</button>
                </div>
                <div className="font-mono text-[10px] text-[var(--text-3)] mb-2">x={fmt(a.x,2)} y={fmt(a.y,2)} w={fmt(a.w,2)} h={fmt(a.h,2)}</div>
                {stimulus.type==='video'&&(
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="font-mono text-[9px] text-[var(--text-3)] uppercase block mb-1">Start (s)</label>
                        <div className="flex gap-1">
                          <input type="number" min="0" max={mediaDur} step="0.1" value={fmt(a.startTime,1)} onChange={e=>updateAoiTime(a.id,'startTime',e.target.value)} className="input-base" style={{padding:'4px 6px',fontSize:11}} />
                          <button onClick={()=>setAoiTimeFromVideo(a.id,'startTime')} className="btn-ghost" style={{padding:'4px 8px',fontSize:9}} title="Set from current video time">⊕</button>
                        </div>
                      </div>
                      <div>
                        <label className="font-mono text-[9px] text-[var(--text-3)] uppercase block mb-1">End (s)</label>
                        <div className="flex gap-1">
                          <input type="number" min="0" max={mediaDur} step="0.1" value={fmt(a.endTime,1)} onChange={e=>updateAoiTime(a.id,'endTime',e.target.value)} className="input-base" style={{padding:'4px 6px',fontSize:11}} />
                          <button onClick={()=>setAoiTimeFromVideo(a.id,'endTime')} className="btn-ghost" style={{padding:'4px 8px',fontSize:9}} title="Set from current video time">⊕</button>
                        </div>
                      </div>
                    </div>
                    <div className="font-mono text-[9px] text-[var(--text-3)] mt-1">Duration: {fmt(a.endTime-a.startTime,1)}s · ⊕ = lấy từ video time hiện tại</div>
                  </>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// PHASE 05 — RECORDING (sequential multi-stimulus, fullscreen)
// ============================================================
function RecordingPhase({onNext,stimuli,updateStimulus}){
  const containerRef=useRef(null);
  const mediaStageRef=useRef(null);
  const videoRef=useRef(null);
  const imgRef=useRef(null);
  const dotRef=useRef(null);
  const gazeBufferRef=useRef([]);
  const startTimeRef=useRef(0);
  const isRecordingRef=useRef(false);
  const aoisRef=useRef([]);
  const stimTypeRef=useRef('image');
  const stimDurationMsRef=useRef(0);
  const imageTimerRef=useRef(null);
  const finalizedRef=useRef(false);
  const advanceLockRef=useRef(false);
  const currentIdxRef=useRef(-1);
  const stimuliRef=useRef(stimuli);
  const startCurrentStimulusRef=useRef(null);

  const [currentIdx,setCurrentIdx]=useState(-1); // -1 = not started, stimuli.length = done
  const [isPlaying,setIsPlaying]=useState(false);
  const [stimTime,setStimTime]=useState(0);
  const [duration,setDuration]=useState(0);
  const [sampleCount,setSampleCount]=useState(0);
  const [liveAoi,setLiveAoi]=useState(null);
  const [isFullscreen,setIsFullscreen]=useState(false);
  const [showFixation,setShowFixation]=useState(false);
  const [mediaBox,setMediaBox]=useState({left:0,top:0,width:0,height:0});
  const colors=['#F59E0B','#06B6D4','#10B981','#EC4899','#8B5CF6','#EF4444'];

  useEffect(()=>{stimuliRef.current=stimuli},[stimuli]);
  useEffect(()=>{currentIdxRef.current=currentIdx},[currentIdx]);

  const commitCurrentIdx=useCallback((idx)=>{
    currentIdxRef.current=idx;
    setCurrentIdx(idx);
  },[]);

  const updateMediaBox=useCallback(()=>{
    const target=stimTypeRef.current==='video'?videoRef.current:imgRef.current;
    const stage=mediaStageRef.current;
    if(!target||!stage)return;
    const r=getRenderedMediaRect(target,stage);
    if(!r||r.width<=0||r.height<=0)return;
    const next={left:r.left,top:r.top,width:r.width,height:r.height};
    setMediaBox(prev=>{
      const same=Math.abs(prev.left-next.left)<0.5&&Math.abs(prev.top-next.top)<0.5&&Math.abs(prev.width-next.width)<0.5&&Math.abs(prev.height-next.height)<0.5;
      return same?prev:next;
    });
  },[]);

  useEffect(()=>{try{window.GazeCloudAPI?.StartEyeTracking?.()}catch(e){}},[]);

  useEffect(()=>{
    const onFs=()=>{setIsFullscreen(!!document.fullscreenElement);setTimeout(updateMediaBox,80)};
    document.addEventListener('fullscreenchange',onFs);
    window.addEventListener('resize',updateMediaBox);
    return()=>{document.removeEventListener('fullscreenchange',onFs);window.removeEventListener('resize',updateMediaBox)};
  },[updateMediaBox]);

  useEffect(()=>{
    if(currentIdx<0||currentIdx>=stimuli.length||showFixation)return;
    updateMediaBox();
    const t=setInterval(updateMediaBox,200);
    return()=>clearInterval(t);
  },[currentIdx,stimuli.length,showFixation,isFullscreen,updateMediaBox]);

  // Single persistent gaze listener — uses refs. GazeCloudAPI returns viewport coordinates as docX/docY.
  useEffect(()=>{
    if(!window.GazeCloudAPI)return;
    let raf=null,lx=0,ly=0,throttle=null,pendingAoi=null;
    const onGaze=(data)=>{
      if(!data||data.state===-1)return;
      lx=Number(data.docX??data.GazeX??data.x);
      ly=Number(data.docY??data.GazeY??data.y);
      if(!Number.isFinite(lx)||!Number.isFinite(ly))return;
      if(!raf){raf=requestAnimationFrame(()=>{if(dotRef.current)dotRef.current.style.display='none';raf=null})}
      if(isRecordingRef.current){
        const target=stimTypeRef.current==='video'?videoRef.current:imgRef.current;
        if(!target)return;
        const r=getRenderedMediaRect(target,mediaStageRef.current);
        if(!r||!r.width||!r.height)return;
        const xN=(lx-r.viewportLeft)/r.width;
        const yN=(ly-r.viewportTop)/r.height;
        const inB=xN>=0&&xN<=1&&yN>=0&&yN<=1;
        let stimT=0;
        if(stimTypeRef.current==='video'&&videoRef.current){stimT=videoRef.current.currentTime}
        else{stimT=(nowMs()-startTimeRef.current)/1000}
        const hit=inB?whichAOI(xN,yN,aoisRef.current,stimT):null;
        pendingAoi=hit?hit.name:null;
        gazeBufferRef.current.push({timestamp:nowMs(),videoTime:stimT*1000,screenX:lx,screenY:ly,xNorm:xN,yNorm:yN,aoi:hit?hit.name:null,trackingState:data.state,rawX:data.GazeX??'',rawY:data.GazeY??''});
        if(!throttle){throttle=setTimeout(()=>{setSampleCount(gazeBufferRef.current.length);setLiveAoi(pendingAoi);throttle=null},250)}
      }
    };
    GazeCloudAPI.OnResult=onGaze;
    return()=>{if(raf)cancelAnimationFrame(raf);if(throttle)clearTimeout(throttle);try{if(window.GazeCloudAPI)window.GazeCloudAPI.OnResult=null}catch(e){}};
  },[]);

  const advanceStimulus=useCallback(()=>{
    if(advanceLockRef.current)return;
    advanceLockRef.current=true;

    const list=stimuliRef.current;
    const idx=currentIdxRef.current;

    // Persist data for current stimulus
    isRecordingRef.current=false;
    if(imageTimerRef.current){clearTimeout(imageTimerRef.current);imageTimerRef.current=null}
    if(idx>=0&&idx<list.length){
      const stim=list[idx];
      const dataCopy=[...gazeBufferRef.current];
      const dur=stimTypeRef.current==='video'
        ?(videoRef.current?.duration||stimDurationMsRef.current/1000)*1000
        :(performance.now()-startTimeRef.current);
      updateStimulus(stim.id,{gazeData:dataCopy,durationMs:dur});
    }

    const next=idx+1;
    if(next>=list.length){
      commitCurrentIdx(list.length);
      setIsPlaying(false);
      try{/* keep GazeCloudAPI running until results */}catch(e){}
      if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}
      setTimeout(()=>{
        if(!finalizedRef.current){finalizedRef.current=true;onNext()}
      },200);
    }else{
      setShowFixation(true);
      setIsPlaying(false);
      setLiveAoi(null);
      setTimeout(()=>{
        setShowFixation(false);
        commitCurrentIdx(next);
        setSampleCount(0);
        setStimTime(0);
        setMediaBox({left:0,top:0,width:0,height:0});
        gazeBufferRef.current=[];
        setTimeout(()=>{startCurrentStimulusRef.current?.(next);advanceLockRef.current=false},120);
      },800);
    }
  },[commitCurrentIdx,onNext,updateStimulus]);

  const startCurrentStimulus=useCallback((idx)=>{
    const list=stimuliRef.current;
    const stim=list[idx];
    if(!stim)return;
    currentIdxRef.current=idx;
    aoisRef.current=stim.aois;
    stimTypeRef.current=stim.type;
    stimDurationMsRef.current=stim.displayDurationSec*1000;
    gazeBufferRef.current=[];
    setSampleCount(0);
    setLiveAoi(null);
    setStimTime(0);
    setMediaBox({left:0,top:0,width:0,height:0});

    if(imageTimerRef.current){clearTimeout(imageTimerRef.current);imageTimerRef.current=null}

    if(stim.type==='video'){
      const v=videoRef.current;
      if(v){
        v.currentTime=0;
        const playP=v.play();
        startTimeRef.current=nowMs();
        isRecordingRef.current=true;
        setIsPlaying(true);
        setDuration(v.duration||stim.displayDurationSec);
        setTimeout(updateMediaBox,80);
        if(playP&&playP.catch)playP.catch(()=>{});
      }
    }else{
      startTimeRef.current=nowMs();
      isRecordingRef.current=true;
      setIsPlaying(true);
      setDuration(stim.displayDurationSec);
      setTimeout(updateMediaBox,80);
      imageTimerRef.current=setTimeout(()=>{advanceStimulus()},stim.displayDurationSec*1000);
    }
  },[advanceStimulus,updateMediaBox]);

  useEffect(()=>{startCurrentStimulusRef.current=startCurrentStimulus},[startCurrentStimulus]);

  // Update video event listeners when stimulus changes
  useEffect(()=>{
    const list=stimuliRef.current;
    if(currentIdx<0||currentIdx>=list.length)return;
    const stim=list[currentIdx];
    if(stim.type!=='video')return;
    const v=videoRef.current;if(!v)return;
    const onTime=()=>{setStimTime(v.currentTime);updateMediaBox()};
    const onLoad=()=>{setDuration(v.duration||stim.displayDurationSec);setTimeout(updateMediaBox,60)};
    const onEnd=()=>{advanceStimulus()};
    v.addEventListener('timeupdate',onTime);
    v.addEventListener('loadedmetadata',onLoad);
    v.addEventListener('loadeddata',onLoad);
    v.addEventListener('ended',onEnd);
    return()=>{
      v.removeEventListener('timeupdate',onTime);
      v.removeEventListener('loadedmetadata',onLoad);
      v.removeEventListener('loadeddata',onLoad);
      v.removeEventListener('ended',onEnd);
    };
  },[currentIdx,advanceStimulus,updateMediaBox]);

  // Image timer + live time tracker
  useEffect(()=>{
    const list=stimuliRef.current;
    if(currentIdx<0||currentIdx>=list.length)return;
    const stim=list[currentIdx];
    if(stim.type!=='image'||!isPlaying)return;
    const tickStart=performance.now();
    const tick=setInterval(()=>{
      setStimTime((performance.now()-tickStart)/1000);
    },100);
    return()=>clearInterval(tick);
  },[currentIdx,isPlaying]);

  const beginSession=async()=>{
    finalizedRef.current=false;
    advanceLockRef.current=false;
    try{
      if(containerRef.current.requestFullscreen)await containerRef.current.requestFullscreen();
      else if(containerRef.current.webkitRequestFullscreen)containerRef.current.webkitRequestFullscreen();
    }catch(e){console.warn('Fullscreen failed, continuing in normal mode',e)}
    commitCurrentIdx(0);
    setTimeout(()=>{startCurrentStimulusRef.current?.(0);advanceLockRef.current=false},180);
  };

  const stopAll=()=>{
    const list=stimuliRef.current;
    const idx=currentIdxRef.current;
    isRecordingRef.current=false;
    if(imageTimerRef.current){clearTimeout(imageTimerRef.current);imageTimerRef.current=null}
    if(videoRef.current){try{videoRef.current.pause()}catch(e){}}
    if(idx>=0&&idx<list.length){
      const stim=list[idx];
      const dur=stimTypeRef.current==='video'?(videoRef.current?.currentTime||0)*1000:(performance.now()-startTimeRef.current);
      updateStimulus(stim.id,{gazeData:[...gazeBufferRef.current],durationMs:dur});
    }
    try{/* keep GazeCloudAPI running until results */}catch(e){}
    if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}
    setTimeout(()=>{if(!finalizedRef.current){finalizedRef.current=true;onNext()}},150);
  };

  const exitFullscreen=()=>{if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}};

  const stim=currentIdx>=0&&currentIdx<stimuli.length?stimuli[currentIdx]:null;
  const progress=duration?Math.min(100,(stimTime/duration)*100):0;
  const safeIdx=Math.max(0,Math.min(currentIdx,stimuli.length));
  const overallProgress=stimuli.length?((safeIdx+(progress/100))/stimuli.length)*100:0;
  const aoiOverlayStyle=mediaBox.width&&mediaBox.height
    ?{left:mediaBox.left,top:mediaBox.top,width:mediaBox.width,height:mediaBox.height}
    :{left:0,top:0,width:'100%',height:'100%'};

  return(
    <div>
      <div className="font-mono text-[10px] text-[var(--accent)] uppercase tracking-[0.3em] mb-4 flex items-center gap-2">
        {isPlaying&&<span className="w-2 h-2 bg-[var(--danger)] rounded-full rec-dot"></span>}
        PHASE 05 / GAZE RECORDING · {stimuli.length} STIMULI {isPlaying&&'· REC'}
      </div>
      <h2 className="font-display text-4xl mb-2">{currentIdx<0?'Sẵn sàng ghi dữ liệu':isPlaying?<>Đang <span className="italic text-[var(--accent)]">ghi dữ liệu</span>…</>:'Đã hoàn tất'}</h2>
      {stim&&<div className="font-mono text-xs text-[var(--text-2)] mb-6">Stimulus #{stim.order} · {stim.name} · {stim.type}</div>}

      <div className="grid grid-cols-12 gap-6">
        <div className="col-span-12 lg:col-span-9">
          <div ref={containerRef} className={isFullscreen?'rec-fs':'panel relative'}>
            {!isFullscreen&&<div className="panel-header"><span>Live Stimulus</span><span className="font-mono">{stim?`#${stim.order}/${stimuli.length}`:'—'} · {fmt(stimTime,2)}s / {fmt(duration,2)}s</span></div>}
            <div ref={mediaStageRef} className="relative bg-black" style={isFullscreen?{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}:{}}>
              {showFixation?(<div style={{minHeight:'40vh',width:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="font-display text-7xl text-[var(--accent)]">+</div></div>):stim?(
                stim.type==='video'?(
                  <video ref={videoRef} src={stim.url} className="block" style={isFullscreen?{width:'100%',height:'100%',objectFit:'contain'}:{width:'100%',height:'65vh',objectFit:'contain'}} />
                ):(
                  <img ref={imgRef} src={stim.url} alt="" className="block" style={isFullscreen?{width:'100%',height:'100%',objectFit:'contain'}:{width:'100%',height:'65vh',objectFit:'contain'}} draggable={false} />
                )
              ):(<div style={{minHeight:'40vh',width:'100%',display:'flex',alignItems:'center',justifyContent:'center'}} className="font-mono text-[var(--text-3)] text-sm">[chưa bắt đầu]</div>)}
              {false&&stim&&!showFixation&&(
                <div className="absolute pointer-events-none" style={aoiOverlayStyle}>
                  {stim.aois.map((a,i)=>{
                    const active=stim.type==='image'?true:(stimTime>=a.startTime&&stimTime<=a.endTime);
                    if(!active)return null;
                    return(<div key={a.id} className="absolute border" style={{left:`${a.x*100}%`,top:`${a.y*100}%`,width:`${a.w*100}%`,height:`${a.h*100}%`,borderColor:colors[i%colors.length]+'80'}}>
                      <div className="absolute -top-5 left-0 font-mono text-[10px] px-1.5 py-0.5 text-black font-bold" style={{background:colors[i%colors.length]}}>{a.name}</div>
                    </div>)
                  })}
                </div>
              )}
            </div>
            {!isFullscreen&&<div className="h-1 bg-[var(--bg)]"><div className="h-full bg-[var(--accent)] transition-all" style={{width:`${progress}%`}}></div></div>}

            {isFullscreen&&(
              <>
                <div className="rec-fs-status">
                  <span className="w-2 h-2 bg-[var(--danger)] rounded-full rec-dot"></span>
                  <span>REC</span><span className="text-[var(--text-3)]">·</span>
                  <span>#{stim?stim.order:'?'}/{stimuli.length}</span><span className="text-[var(--text-3)]">·</span>
                  <span>{fmt(stimTime,1)}s / {fmt(duration,1)}s</span><span className="text-[var(--text-3)]">·</span>
                  <span>Samples: {sampleCount}</span>
                </div>
                <div className="rec-fs-controls">
                  <div className="font-mono text-[10px] text-[var(--text-2)]">Overall: {fmt(overallProgress,0)}%</div>
                  <button onClick={stopAll} className="btn-danger" style={{padding:'8px 16px'}}>⏹ DỪNG TẤT CẢ</button>
                  <button onClick={exitFullscreen} className="btn-ghost" style={{padding:'8px 16px'}}>⤢ Thoát fullscreen</button>
                </div>
              </>
            )}
          </div>
          <div ref={dotRef} className="gaze-dot" style={{display:'none'}}></div>
        </div>

        <div className="col-span-12 lg:col-span-3">
          <div className="panel mb-4">
            <div className="panel-header"><span>Live Telemetry</span><span>/ RT</span></div>
            <div className="p-5 space-y-4">
              <Stat label="Current Stim" value={stim?`#${stim.order} / ${stimuli.length}`:'—'} mono />
              <Stat label="Samples (this stim)" value={sampleCount} mono />
              <Stat label="Stim Time" value={fmt(stimTime,2)+'s'} mono />
              <Stat label="Sample Rate" value={stimTime?`${fmt(sampleCount/stimTime,0)} Hz`:'—'} mono />
              <Stat label="Overall Progress" value={fmt(overallProgress,0)+'%'} mono />
            </div>
          </div>

          <div className="panel mb-4">
            <div className="panel-header"><span>Sequence</span><span>/ STIM LIST</span></div>
            <div className="max-h-[280px] overflow-y-auto">
              {stimuli.map((s,i)=>{
                const status=i<currentIdx?'done':(i===currentIdx?'active':'pending');
                return(
                  <div key={s.id} className="px-3 py-2 border-b border-[var(--border)] last:border-b-0 flex items-center gap-2">
                    <div className="font-mono text-[10px] w-6 text-[var(--text-3)]">#{s.order}</div>
                    <div className={`text-xs flex-1 truncate ${status==='active'?'text-[var(--accent)]':status==='done'?'text-[var(--success)]':'text-[var(--text-3)]'}`}>{s.name}</div>
                    <div className="font-mono text-[9px] text-[var(--text-3)]">{status==='done'?'✓':status==='active'?'●':'○'}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {currentIdx<0&&(
            <div className="space-y-2">
              <button onClick={beginSession} className="btn-primary w-full" style={{padding:'14px'}}>● Bắt đầu ghi (Fullscreen)</button>
              <div className="font-mono text-[10px] text-[var(--text-3)] text-center">{stimuli.length} stimuli sẽ được trình bày tuần tự. Bấm ESC hoặc nút dừng để kết thúc sớm.</div>
            </div>
          )}
          {isPlaying&&(
            <div className="space-y-2">
              <button onClick={stopAll} className="btn-danger w-full">⏹ Kết thúc sớm</button>
            </div>
          )}
          {currentIdx>=stimuli.length&&<button onClick={()=>{if(!finalizedRef.current){finalizedRef.current=true;onNext()}}} className="btn-primary w-full">→ Xem kết quả</button>}
        </div>
      </div>
    </div>
  );
}

function Stat({label,value,mono,color}){return(<div><div className="font-mono text-[10px] text-[var(--text-3)] uppercase tracking-widest mb-1">{label}</div><div className={`text-lg ${mono?'font-mono':''}`} style={{color:color||'var(--text)'}}>{value}</div></div>)}

// ============================================================
// PHASE 06 — RESULTS (per-stimulus tabs + aggregate, static cached heatmap)
// ============================================================
function ResultsPhase({sessionId,demographics,stimuli,onRestart,projectInfo}){
  const [activeIdx,setActiveIdx]=useState(0);
  const [savedTestAt,setSavedTestAt]=useState(null);
  const [saveTestError,setSaveTestError]=useState(null);
  const savedTestRef=useRef(false);
  const colors=['#F59E0B','#06B6D4','#10B981','#EC4899','#8B5CF6','#EF4444'];

  useEffect(()=>{try{window.GazeCloudAPI?.StopEyeTracking?.()}catch(e){}},[]);

  // Compute results for each stimulus
  const stimulusResults=useMemo(()=>stimuli.map(s=>{
    const fixations=detectFixations(s.gazeData.map(p=>({x:p.xNorm*1000,y:p.yNorm*1000,timestamp:p.timestamp,videoTime:p.videoTime}))).map(f=>({...f,x:f.x/1000,y:f.y/1000}));
    const metrics=computeMetrics(s.gazeData,fixations,s.aois,s.durationMs||s.displayDurationSec*1000);
    return{stimulus:s,fixations,gazeData:s.gazeData,session:metrics.session,aois:metrics.aois};
  }),[stimuli]);

  useEffect(()=>{
    if(savedTestRef.current||!stimulusResults.length)return;
    savedTestRef.current=true;
    saveTestSessionRecord({sessionId,projectInfo,demographics,stimulusResults})
      .then(r=>setSavedTestAt(r?.createdAt||new Date().toISOString()))
      .catch(e=>{console.error(e);setSaveTestError(e.message||String(e))});
  },[sessionId,projectInfo?.id,projectInfo?.name,demographics,stimulusResults]);

  const handleXlsx=()=>exportToExcel({sessionId,demographics,stimulusResults});
  const handleSpssCsv=()=>exportToCSV({sessionId,demographics,stimulusResults});
  const handleRawCsv=()=>exportRawCSV({sessionId,demographics,stimulusResults});

  // Aggregate session stats (sum/average across stimuli)
  const aggregate=useMemo(()=>{
    const tot={samples:0,fix:0,sac:0,scan:0,engSum:0,focSum:0,covSum:0,n:stimulusResults.length};
    stimulusResults.forEach(r=>{
      tot.samples+=r.session.totalSamples;
      tot.fix+=r.session.totalFixations;
      tot.sac+=r.session.totalSaccades;
      tot.scan+=r.session.scanPathLength;
      tot.engSum+=r.session.engagementScore;
      tot.focSum+=r.session.videoFocus;
      tot.covSum+=r.session.aoiCoverage;
    });
    return{
      totalSamples:tot.samples,totalFixations:tot.fix,totalSaccades:tot.sac,
      totalScanPath:tot.scan,
      meanEngagement:tot.n?tot.engSum/tot.n:0,
      meanFocus:tot.n?tot.focSum/tot.n:0,
      meanCoverage:tot.n?tot.covSum/tot.n:0,
    };
  },[stimulusResults]);

  const result=stimulusResults[activeIdx];

  return(
    <div>
      <div className="flex justify-between items-start mb-6 flex-wrap gap-4">
        <div>
          <div className="font-mono text-[10px] text-[var(--accent)] uppercase tracking-[0.3em] mb-4">PHASE 06 / ANALYSIS · {stimuli.length} STIMULI</div>
          <h2 className="font-display text-4xl mb-1">Kết quả phiên ghi</h2>
          <div className="font-mono text-xs text-[var(--text-2)]">{sessionId} · {demographics.participantId} · {demographics.name} ({demographics.age}, {demographics.gender})</div>
          <div className={`font-mono text-[10px] mt-2 ${saveTestError?'text-[var(--danger)]':'text-[var(--success)]'}`}>{saveTestError?('Lưu dữ liệu test lỗi: '+saveTestError):(savedTestAt?'✓ Đã lưu dữ liệu test vào Admin mode':'Đang lưu dữ liệu test vào Admin mode…')}</div>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button onClick={onRestart} className="btn-ghost">↻ Session mới</button>
          <button onClick={handleRawCsv} className="btn-ghost">↓ Raw CSV</button>
          <button onClick={handleSpssCsv} className="btn-ghost">↓ SPSS CSV</button>
          <button onClick={handleXlsx} className="btn-primary">↓ Excel (.xlsx)</button>
        </div>
      </div>

      {/* Aggregate stats */}
      <div className="panel mb-6">
        <div className="panel-header"><span>Aggregate · All Stimuli</span><span className="font-mono">N = {stimuli.length}</span></div>
        <div className="grid grid-cols-2 md:grid-cols-6 gap-3 p-4">
          <Kpi label="Mean Engagement" value={fmt(aggregate.meanEngagement,1)+'%'} sub="across stimuli" accent />
          <Kpi label="Mean Focus" value={fmt(aggregate.meanFocus,1)+'%'} sub="in-bounds" />
          <Kpi label="Mean Coverage" value={fmt(aggregate.meanCoverage,0)+'%'} sub="AOI visited" />
          <Kpi label="Total Samples" value={aggregate.totalSamples} sub="all stim" />
          <Kpi label="Total Fixations" value={aggregate.totalFixations} sub="all stim" />
          <Kpi label="Total Scan Path" value={fmt(aggregate.totalScanPath,2)} sub="cumulative" />
        </div>
      </div>

      {/* Stimulus tabs */}
      <div className="flex gap-2 mb-6 flex-wrap">
        {stimuli.map((s,i)=>(
          <button key={s.id} onClick={()=>setActiveIdx(i)} className={`stim-tab ${i===activeIdx?'active':''}`}>
            #{s.order} {s.name.slice(0,18)}{s.name.length>18?'…':''}
          </button>
        ))}
      </div>

      {result&&<StimulusResults result={result} colors={colors} />}

      <div className="mt-8 panel p-5">
        <div className="font-mono text-[10px] text-[var(--accent)] uppercase tracking-widest mb-3">Hướng dẫn sử dụng dữ liệu cho SPSS</div>
        <div className="text-xs text-[var(--text-2)] leading-relaxed space-y-2">
          <p><span className="font-mono text-[var(--accent)]">SPSS CSV</span> sử dụng <span className="text-[var(--accent)]">long format</span>: 1 dòng / (người tham gia × stimulus). Phù hợp cho <span className="text-[var(--accent)]">repeated-measures designs</span> và mixed-effects models.</p>
          <p>Categorical đã mã hoá: gender_code (1=Nam, 2=Nữ, 3=Khác); education_code (1=THPT, 2=Đại học, 3=Sau đại học).</p>
          <p>Khi gộp nhiều người: thu thập file CSV của từng người, mở SPSS → File → Import Data → CSV, dùng Add Files để gộp dataset trước khi chạy thống kê. Biến <span className="font-mono text-[var(--accent)]">stimulus_id</span> dùng làm within-subject factor.</p>
          <p><span className="font-mono text-[var(--accent)]">Raw CSV</span> dùng cho phân tích time-series — có cột stimulus_id để filter / split.</p>
        </div>
      </div>

      <div className="mt-8 divider-ornate"><span>End of Analysis</span></div>
    </div>
  );
}

function StimulusResults({result,colors}){
  const {stimulus,fixations,gazeData,session,aois}=result;
  const heatmapRef=useRef(null);
  const mediaRef=useRef(null);
  const [mediaSize,setMediaSize]=useState({w:0,h:0});
  const [heatmapMode,setHeatmapMode]=useState('static');
  const [dynamicMs,setDynamicMs]=useState(0);
  const [dynamicPlaying,setDynamicPlaying]=useState(false);
  const [exportingDynamic,setExportingDynamic]=useState(false);
  const heatmapCacheRef=useRef({key:null,canvas:null});
  const dynamicWindowMs=1500;

  useEffect(()=>{setHeatmapMode('static');setDynamicMs(0);setDynamicPlaying(false)},[stimulus.id]);

  const validGaze=useMemo(()=>gazeData.filter(p=>p.xNorm>=0&&p.xNorm<=1&&p.yNorm>=0&&p.yNorm<=1),[gazeData]);
  const stimDurMs=stimulus.durationMs||stimulus.displayDurationSec*1000;
  const dynamicFrameKey=Math.round(dynamicMs/120);
  const displayGaze=useMemo(()=>{
    if(heatmapMode==='static')return validGaze;
    const t=dynamicFrameKey*120;
    return validGaze.filter(p=>p.videoTime>=t-dynamicWindowMs&&p.videoTime<=t);
  },[validGaze,heatmapMode,dynamicFrameKey]);

  // Compute the low-res heatmap once per gaze slice. Static result is cached.
  const heatmapLowRes=useMemo(()=>{
    if(heatmapMode==='static'){
      const key=stimulus.id+'_'+gazeData.length+'_static';
      if(heatmapCacheRef.current.key===key&&heatmapCacheRef.current.canvas)return heatmapCacheRef.current.canvas;
      const lowRes=buildHeatmapLowRes(validGaze,400,225);
      heatmapCacheRef.current={key,canvas:lowRes};
      return lowRes;
    }
    return buildHeatmapLowRes(displayGaze,400,225);
  },[stimulus.id,gazeData.length,validGaze,displayGaze,heatmapMode]);

  useEffect(()=>{
    if(!dynamicPlaying)return;
    let raf=null;
    const base=performance.now()-dynamicMs;
    const tick=()=>{
      const dur=Math.max(1,stimDurMs);
      setDynamicMs((performance.now()-base)%dur);
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return()=>raf&&cancelAnimationFrame(raf);
  },[dynamicPlaying,stimDurMs]);

  useEffect(()=>{
    if(heatmapMode!=='dynamic'||stimulus.type!=='video')return;
    const el=mediaRef.current;if(!el)return;
    const target=dynamicMs/1000;
    if(Number.isFinite(target)&&Math.abs((el.currentTime||0)-target)>0.18){try{el.currentTime=target}catch(e){}}
  },[heatmapMode,dynamicMs,stimulus.type]);

  // Track media element size; repaint heatmap on resize
  useEffect(()=>{
    const el=mediaRef.current;
    if(!el)return;
    const updateSize=()=>{const w=el.clientWidth,h=el.clientHeight;if(w&&h)setMediaSize({w,h})};
    updateSize();
    if(stimulus.type==='image'){
      if(el.complete)updateSize();
      else el.addEventListener('load',updateSize);
    }else el.addEventListener('loadedmetadata',updateSize);
    const ro=new ResizeObserver(updateSize);ro.observe(el);window.addEventListener('resize',updateSize);
    return()=>{ro.disconnect();window.removeEventListener('resize',updateSize);if(stimulus.type==='image')el.removeEventListener('load',updateSize);else el.removeEventListener('loadedmetadata',updateSize)};
  },[stimulus.id,stimulus.type]);

  // Paint current heatmap slice onto target canvas
  useEffect(()=>{
    if(!heatmapRef.current||!mediaSize.w||!mediaSize.h)return;
    paintHeatmapToTarget(heatmapRef.current,heatmapLowRes,mediaSize.w,mediaSize.h);
  },[heatmapLowRes,mediaSize]);

  const sortedAois=[...aois].map((a,i)=>({...a,color:colors[i%colors.length]})).sort((a,b)=>b.totalDwellMs-a.totalDwellMs);

  const timelineBins=useMemo(()=>{
    const bins=60;const dur=stimDurMs;const bs=dur/bins;
    return Array.from({length:bins},(_,i)=>{const t0=i*bs,t1=(i+1)*bs;const ib=gazeData.filter(p=>p.videoTime>=t0&&p.videoTime<t1);const ia=ib.filter(p=>p.aoi!=null).length;return{t:(t0+t1)/2,count:ib.length,aoi:ia}});
  },[gazeData,stimDurMs]);

  const getExportSize=(source)=>{
    const sw=source?.videoWidth||source?.naturalWidth||mediaSize.w||1280;
    const sh=source?.videoHeight||source?.naturalHeight||mediaSize.h||720;
    const outW=Math.min(1920,Math.max(900,sw));
    const outH=Math.round(outW*(sh/sw));
    return{w:outW,h:outH};
  };
  const drawContained=(ctx,source,w,h)=>{
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
    const sw=source?.videoWidth||source?.naturalWidth||w;
    const sh=source?.videoHeight||source?.naturalHeight||h;
    const scale=Math.min(w/sw,h/sh);
    const dw=sw*scale,dh=sh*scale,dx=(w-dw)/2,dy=(h-dh)/2;
    try{ctx.drawImage(source,dx,dy,dw,dh)}catch(e){}
    return{dx,dy,dw,dh};
  };
  const drawAoiBoxes=(ctx,rect)=>{
    ctx.save();ctx.lineWidth=Math.max(2,rect.dw/500);ctx.font=`${Math.max(14,Math.round(rect.dw/70))}px JetBrains Mono, monospace`;ctx.textBaseline='top';
    aois.forEach((a,i)=>{
      const col=colors[i%colors.length];const x=rect.dx+a.x*rect.dw,y=rect.dy+a.y*rect.dh,w=a.w*rect.dw,h=a.h*rect.dh;
      ctx.strokeStyle=col;ctx.globalAlpha=0.95;ctx.strokeRect(x,y,w,h);
      const label=a.name||`AOI ${i+1}`;const tw=ctx.measureText(label).width+10;ctx.globalAlpha=0.95;ctx.fillStyle=col;ctx.fillRect(x,Math.max(0,y-22),tw,22);ctx.fillStyle='#111';ctx.fillText(label,x+5,Math.max(0,y-20));
    });
    ctx.restore();
  };
  const drawComposite=(ctx,source,points,modeLabel)=>{
    const w=ctx.canvas.width,h=ctx.canvas.height;
    const rect=drawContained(ctx,source,w,h);
    const low=buildHeatmapLowRes(points,400,225);
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.86;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(low,rect.dx,rect.dy,rect.dw,rect.dh);ctx.restore();
    drawAoiBoxes(ctx,rect);
    ctx.save();ctx.font='16px JetBrains Mono, monospace';ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(14,14,Math.min(w-28,620),32);ctx.fillStyle='#fff';ctx.fillText(`${modeLabel} · ${stimulus.name} · ${stimulus.industry||'No industry'}`,24,23);ctx.restore();
  };
  const ensureImage=()=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=stimulus.url});
  const ensureVideoMetadata=()=>new Promise((resolve,reject)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.onloadedmetadata=()=>resolve(v);v.onerror=reject;v.src=stimulus.url;v.load()});
  const seekVideo=(v,t)=>new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;v.removeEventListener('seeked',finish);resolve()};v.addEventListener('seeked',finish);try{v.currentTime=t}catch(e){finish()}setTimeout(finish,800)});

  const downloadStaticHeatmap=async()=>{
    const source=stimulus.type==='image'?await ensureImage():mediaRef.current;
    const {w,h}=getExportSize(source);const c=document.createElement('canvas');c.width=w;c.height=h;
    drawComposite(c.getContext('2d'),source,validGaze,'STATIC HEATMAP');
    c.toBlob(blob=>blob&&downloadBlob(blob,`static_heatmap_${slug(stimulus.name)}.png`),'image/png');
  };
  const downloadDynamicHeatmap=async()=>{
    if(!window.MediaRecorder){alert('Trình duyệt này không hỗ trợ xuất dynamic heatmap WebM. Hãy dùng Chrome/Edge mới.');return}
    setExportingDynamic(true);
    try{
      const source=stimulus.type==='image'?await ensureImage():await ensureVideoMetadata();
      const {w,h}=getExportSize(source);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');
      const fps=12,step=1000/fps,dur=Math.max(1000,Math.min(stimDurMs,(source.duration?source.duration*1000:stimDurMs)||stimDurMs));
      const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':(MediaRecorder.isTypeSupported('video/webm')?'video/webm':'');
      const stream=c.captureStream(fps);const chunks=[];const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
      const done=new Promise(resolve=>{rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};rec.onstop=resolve});
      rec.start();
      for(let t=0;t<=dur;t+=step){
        if(stimulus.type==='video')await seekVideo(source,Math.min((source.duration||dur/1000)-0.05,t/1000));
        const slice=validGaze.filter(p=>p.videoTime>=t-dynamicWindowMs&&p.videoTime<=t);
        drawComposite(ctx,source,slice,`DYNAMIC HEATMAP · ${fmt(t/1000,1)}s`);
        await sleep(step);
      }
      rec.stop();await done;stream.getTracks().forEach(tr=>tr.stop());
      downloadBlob(new Blob(chunks,{type:mime||'video/webm'}),`dynamic_heatmap_${slug(stimulus.name)}.webm`);
    }catch(e){alert('Không xuất được dynamic heatmap: '+(e.message||e))}
    finally{setExportingDynamic(false)}
  };

  return(
    <div>
      <div className="font-mono text-xs text-[var(--text-2)] mb-4">
        <span className="text-[var(--accent)]">Stimulus #{stimulus.order}</span> · {stimulus.name} · ngành: {stimulus.industry||'—'} · {stimulus.type} · {stimulus.fileName}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-6 gap-3 mb-4">
        <Kpi label="Engagement" value={fmt(session.engagementScore,1)+'%'} sub="time on AOIs" accent />
        <Kpi label="Stim Focus" value={fmt(session.videoFocus,1)+'%'} sub="inside stim" />
        <Kpi label="AOI Coverage" value={fmt(session.aoiCoverage,0)+'%'} sub="visited" />
        <Kpi label="Fixations" value={session.totalFixations} sub={`${fmt(session.fixationRatePerSec,1)}/s`} />
        <Kpi label="Mean Fix Dur" value={fmt(session.meanFixationDurMs,0)+'ms'} sub="avg" />
        <Kpi label="Duration" value={fmt(stimDurMs/1000,1)+'s'} sub="recorded" />
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <SmallStat label="Total Samples" value={session.totalSamples} />
        <SmallStat label="Total Saccades" value={session.totalSaccades} />
        <SmallStat label="Sampling Rate" value={fmt(session.samplingRateHz,1)+' Hz'} />
        <SmallStat label="Median Fix Dur" value={fmt(session.medianFixationDurMs,0)+'ms'} />
        <SmallStat label="Std Fix Dur" value={fmt(session.stdFixationDurMs,0)+'ms'} />
        <SmallStat label="Mean Saccade Amp" value={fmt(session.meanSaccadeAmp,3)} />
        <SmallStat label="Scan Path Length" value={fmt(session.scanPathLength,2)} />
        <SmallStat label="TTFF" value={session.timeToFirstFixationMs?fmtMs(session.timeToFirstFixationMs):'—'} />
      </div>

      <div className="grid grid-cols-12 gap-6">
        <div className="col-span-12 lg:col-span-8">
          <div className="panel">
            <div className="panel-header"><span>{heatmapMode==='static'?'Attention Heatmap (Static)':'Attention Heatmap (Dynamic)'}</span><span className="font-mono">N = {displayGaze.length} / {validGaze.length}</span></div>
            <div className="relative bg-black">
              {stimulus.type==='video'?(
                <video ref={mediaRef} src={stimulus.url} muted controls className="block w-full" style={{maxHeight:'60vh'}} />
              ):(
                <img ref={mediaRef} src={stimulus.url} alt="" className="block w-full" style={{maxHeight:'60vh',objectFit:'contain'}} draggable={false} />
              )}
              <canvas ref={heatmapRef} className="absolute inset-0 w-full h-full pointer-events-none" style={{mixBlendMode:'screen',opacity:0.85}} />
              <div className="absolute inset-0 pointer-events-none">{aois.map((a,i)=>(<div key={a.id} className="absolute border" style={{left:`${a.x*100}%`,top:`${a.y*100}%`,width:`${a.w*100}%`,height:`${a.h*100}%`,borderColor:colors[i%colors.length]+'cc'}}><div className="absolute -top-5 left-0 font-mono text-[10px] px-1.5 py-0.5 text-black font-bold" style={{background:colors[i%colors.length]}}>{a.name}</div></div>))}</div>
            </div>
            <div className="p-3 space-y-3">
              <div className="font-mono text-[10px] text-[var(--text-3)] flex items-center justify-between"><span>LOW ←</span><div className="flex-1 mx-3 h-1.5" style={{background:'linear-gradient(90deg,rgb(20,60,180),rgb(0,200,255),rgb(0,240,0),rgb(255,255,0),rgb(255,55,0))'}}></div><span>→ HIGH</span></div>
              <div className="flex flex-wrap gap-2 items-center justify-between">
                <div className="flex gap-2 flex-wrap"><button onClick={()=>{setHeatmapMode('static');setDynamicPlaying(false)}} className={heatmapMode==='static'?'btn-primary':'btn-ghost'}>Static</button><button onClick={()=>setHeatmapMode('dynamic')} className={heatmapMode==='dynamic'?'btn-primary':'btn-ghost'}>Dynamic</button>{heatmapMode==='dynamic'&&<button onClick={()=>setDynamicPlaying(v=>!v)} className="btn-ghost">{dynamicPlaying?'Pause':'Play'}</button>}</div>
                <div className="flex gap-2 flex-wrap"><button onClick={downloadStaticHeatmap} className="btn-ghost">↓ Static PNG</button><button onClick={downloadDynamicHeatmap} disabled={exportingDynamic} className="btn-primary">{exportingDynamic?'Đang xuất…':'↓ Dynamic WebM'}</button></div>
              </div>
              {heatmapMode==='dynamic'&&(<div className="flex items-center gap-3 font-mono text-[10px] text-[var(--text-2)]"><span>{fmt(dynamicMs/1000,1)}s</span><input type="range" min="0" max={Math.max(1,stimDurMs)} step="50" value={dynamicMs} onChange={e=>{setDynamicPlaying(false);setDynamicMs(Number(e.target.value))}} className="flex-1 accent-[var(--accent)]" /><span>{fmt(stimDurMs/1000,1)}s</span></div>)}
            </div>
          </div>
        </div>

        <div className="col-span-12 lg:col-span-4">
          <div className="panel">

function AdminTestDataPanel({projectInfo}){

    setLoading(true);

      const current=projectInfo?.id?await loadTestSessions(projectInfo.id):[];
      const all=await loadTestSessions(null);
      setProjectCount(current.length);setAllCount(all.length);
      setSessions(scope==='all'||!projectInfo?.id?all:current);
    }finally{setLoading(false)}
  },[projectInfo?.id,scope]);

    if(!confirm(`Xoá dữ liệu test của ${name||id}? Dữ liệu này sẽ không còn xuất hiện trong file Excel tổng.`))return;

          <button onClick={exportAll} className="btn-ghost">↓ Xuất Excel tất cả project</button>

        <div className="font-mono text-[10px] text-[var(--text-3)] mb-3">Mỗi lần Participant hoàn thành test, dữ liệu sẽ tự lưu ở đây. Nếu không thấy ở “Project hiện tại”, bấm “Tất cả user” để xem toàn bộ dữ liệu đã lưu trong IndexedDB.</div>

          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="font-mono text-[10px] text-[var(--text-3)] uppercase tracking-widest"><tr className="border-b border-[var(--border)]"><th className="text-left p-2">User</th><th className="text-left p-2">Project</th><th className="text-left p-2">Session</th><th className="text-left p-2">Thời gian</th><th className="text-right p-2">Stim</th><th className="text-right p-2">Samples</th><th className="text-right p-2">Fixations</th><th className="text-right p-2">Action</th></tr></thead>

        )}

function App(){
  const [storageReady,setStorageReady]=useState(false);
  const [mode,setMode]=useState(null);
  const [phase,setPhase]=useState('upload');
  const [demographics,setDemographics]=useState({participantId:'P001',name:'',age:'',gender:'',education:'',email:'',consent:false});
  const [stimuli,setStimuli]=useState([]);
  const [projectInfo,setProjectInfo]=useState({id:null,name:DEFAULT_PROJECT_NAME,createdAt:null});
  const [projects,setProjects]=useState([]);
  const [gazeReady,setGazeReady]=useState(false);
  const [sessionId,setSessionId]=useState(generateSessionId());

  const refreshProjects=useCallback(async()=>{const list=await loadProjectList();setProjects(list);return list},[]);
  const loadProject=useCallback(async(projectId=null)=>{
    const p=await loadStoredProject(projectId);
    if(p){setProjectInfo({id:p.id,name:p.name||DEFAULT_PROJECT_NAME,createdAt:p.createdAt});setStimuli(hydrateStoredStimuli(p.stimuli));}
    else{setProjectInfo({id:null,name:DEFAULT_PROJECT_NAME,createdAt:null});setStimuli([])}
    await refreshProjects();return p;
  },[refreshProjects]);

  useEffect(()=>{(async()=>{await loadProject();setStorageReady(true)})().catch(e=>{console.error(e);setStorageReady(true)})},[loadProject]);

  const updateStimulus=useCallback((id,patch)=>{setStimuli(prev=>prev.map(s=>s.id===id?{...s,...patch}:s));},[]);
  const saveCurrentProject=useCallback(async()=>{
    const p=await saveStoredProject(stimuli,projectInfo);
    setProjectInfo({id:p.id,name:p.name||DEFAULT_PROJECT_NAME,createdAt:p.createdAt});
    await refreshProjects();return p;
  },[stimuli,projectInfo,refreshProjects]);
  const createNewProject=useCallback(async()=>{
    const p=await createStoredProject(`Project ${projects.length+1}`);
    setProjectInfo({id:p.id,name:p.name,createdAt:p.createdAt});setStimuli([]);await refreshProjects();setMode('admin');setPhase('upload');
  },[projects.length,refreshProjects]);
  const selectProject=useCallback(async(id)=>{await loadProject(id);setMode('admin');setPhase('upload')},[loadProject]);
  const deleteProjectFlow=useCallback(async(id)=>{
    const target=projects.find(p=>p.id===id);
    if(!id)return;
    if(!confirm(`Xoá project "${target?.name||id}"? Ảnh/video, AOI và dữ liệu test đã lưu của project này cũng sẽ bị xoá khỏi IndexedDB.`))return;
    try{
      const list=await deleteStoredProject(id);
      setProjects(list);
      if(list.length){await loadProject(list[0].id);setMode('admin');setPhase('upload')}
      else{setProjectInfo({id:null,name:DEFAULT_PROJECT_NAME,createdAt:null});setStimuli([]);setMode(null);setPhase('upload')}
    }catch(e){
      console.error(e);
      alert('Không xoá được project: '+(e?.message||String(e)));
      await refreshProjects();
    }
  },[projects,refreshProjects,loadProject]);
  const enterAdmin=async()=>{await refreshProjects();setMode('admin');setPhase(stimuli.length?'aoi':'upload')};
  const enterUser=async()=>{setSessionId(generateSessionId());const p=projectInfo.id?await loadStoredProject(projectInfo.id):await loadStoredProject();if(p){setProjectInfo({id:p.id,name:p.name||DEFAULT_PROJECT_NAME,createdAt:p.createdAt});if(p.stimuli?.length)setStimuli(hydrateStoredStimuli(p.stimuli));}setMode('user');setPhase('welcome')};
  const backToMode=()=>{setMode(null);setPhase('upload')};
  const restartUser=async()=>{try{window.GazeCloudAPI?.StopEyeTracking?.()}catch(e){};setSessionId(generateSessionId());const p=projectInfo.id?await loadStoredProject(projectInfo.id):await loadStoredProject();if(p?.stimuli?.length)setStimuli(hydrateStoredStimuli(p.stimuli));setGazeReady(false);setPhase('welcome')};
  const setProjectName=(name)=>setProjectInfo(p=>({...p,name}));
  const hasProject=stimuli.length>0;

  if(!mode){return <ModeSelect onAdmin={enterAdmin} onUser={enterUser} hasProject={hasProject} projects={projects} currentProjectId={projectInfo.id} onSelectProject={selectProject} onNewProject={createNewProject} onDeleteProject={deleteProjectFlow} storageReady={storageReady} />}
  if(mode==='admin'){
    const adminBar=<AdminProjectBar projects={projects} currentProjectId={projectInfo.id} onSelectProject={selectProject} onNewProject={createNewProject} onDeleteProject={deleteProjectFlow} projectInfo={projectInfo} onProjectNameChange={setProjectName} onSaveProject={saveCurrentProject} />;
    if(phase==='upload')return <Shell phase="upload"><FloatingHomeButton onClick={backToMode} />{adminBar}<UploadPhase onNext={async()=>{await saveCurrentProject();setPhase('aoi')}} stimuli={stimuli} setStimuli={setStimuli} projectInfo={projectInfo} onProjectNameChange={setProjectName} onCreateProject={createNewProject} onSaveProject={saveCurrentProject} /><AdminTestDataPanel projectInfo={projectInfo} /></Shell>;
    if(phase==='aoi')return <Shell phase="aoi"><FloatingHomeButton onClick={backToMode} />{adminBar}<AoiPhase onNext={async()=>{await saveCurrentProject();setPhase('admin_done')}} stimuli={stimuli} updateStimulus={updateStimulus} onEditStimuli={()=>setPhase('upload')} onCreateProject={createNewProject} onSaveProject={saveCurrentProject} projectInfo={projectInfo} onProjectNameChange={setProjectName} /><AdminTestDataPanel projectInfo={projectInfo} /></Shell>;
    return <AdminComplete stimuli={stimuli} projectInfo={projectInfo} onProjectNameChange={setProjectName} onBack={()=>setPhase('aoi')} onEditStimuli={()=>setPhase('upload')} onUser={enterUser} onCreateProject={createNewProject} onSaveProject={saveCurrentProject} projects={projects} onSelectProject={selectProject} onDeleteProject={deleteProjectFlow} onHome={backToMode} />;
  }
  return(<Shell phase={phase}>{phase!=='calibration'&&<FloatingHomeButton onClick={backToMode} />}<div className="mb-4 flex justify-end"><button onClick={backToMode} className="btn-ghost">← Chọn lại mode</button></div>{phase==='welcome'&&<WelcomePhase onNext={()=>setPhase('calibration')} demographics={demographics} setDemographics={setDemographics} />}{phase==='calibration'&&<CalibrationPhase onNext={()=>setPhase('recording')} gazeReady={gazeReady} setGazeReady={setGazeReady} />}{phase==='recording'&&<RecordingPhase onNext={()=>setPhase('results')} stimuli={stimuli} updateStimulus={updateStimulus} />}{phase==='results'&&<ResultsPhase sessionId={sessionId} demographics={demographics} stimuli={stimuli} onRestart={restartUser} projectInfo={projectInfo} />}</Shell>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
